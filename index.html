--chart1:#8db8e3;--chart2:#eba068}}

--acc:#8db8e3;--acc-ink:#10151b;--accs:#26323f;--up:#7fcf9c;--ups:#1f3328;--down:#f0957f;--downs:#3d2620;--flat:#b3afa7;--flats:#2c2e31;--new:#e3c06e;--news:#3a3220;
--chart1:#8db8e3;--chart2:#eba068}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
@media (min-width:900px) and (orientation:landscape){main{max-width:860px;padding-left:24px;padding-right:24px}body .rate .inner{max-width:760px}}
h1{font-size:1.7rem;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:.92rem}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.block{width:100%;padding:14px}
.btn.ghost{background:none;border:none;color:var(--acc);padding:8px 4px}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.45;cursor:default}
.fab{width:46px;height:46px;border-radius:50%;border:none;background:var(--acc);color:var(--acc-ink);font-size:1.6rem;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.92rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dash{border-style:dashed;background:none}
select.chip{width:auto;appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;color:var(--ink)}
select.chip.warnchip{border-color:var(--new);color:var(--new)}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font:600 .95rem ui-monospace,Menlo,monospace;flex:none}
.code{font:600 1.05rem ui-monospace,Menlo,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.b-besser{background:var(--ups);color:var(--up)}.b-schlechter{background:var(--downs);color:var(--down)}
.b-stabil,.b-gemischt{background:var(--flats);color:var(--flat)}.b-neu{background:var(--news);color:var(--new)}
.tag{display:inline-block;background:var(--accs);color:var(--acc);border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:600}
.hint{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.88rem;margin:4px 0 12px}
label{display:block;font-weight:600;margin:14px 0 6px}
.sub{font-weight:400;color:var(--muted);font-size:.86rem;margin:-2px 0 6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px;font-weight:600}
.toggle button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.tip{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.tip summary{cursor:pointer;color:var(--acc);font-weight:600}
.dentry{border-top:1px solid var(--line);padding:10px 0}.dentry:first-of-type{border-top:none}
.cat{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}
.cat.c-Notiz{background:var(--accs);color:var(--chart1)}.cat.c-Erfolg{background:var(--ups);color:var(--up)}.cat.c-Vorfall{background:var(--downs);color:var(--down)}.cat.c-Elternkontakt,.cat.c-Gespräch{background:var(--accs);color:var(--acc)}.cat.c-Absprache{background:var(--news);color:var(--new)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}.catpick button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:.88rem;font-weight:600}.catpick button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:160px;background:none;border:none;padding:9px 0 10px;color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px}
/* Bewerten */
.rate{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;overflow:auto}
.rate .inner{max-width:640px;width:100%;margin:0 auto;padding:12px 16px;flex:1;display:flex;flex-direction:column}
.progress{display:flex;gap:6px;margin:10px 0 12px}.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}.progress i.on{background:var(--acc)}
.goalTitle{font-size:1.65rem;font-weight:700;text-align:center;margin:22px 0 4px;line-height:1.2}
.big{font-size:3rem;font-weight:700;text-align:center;height:64px;margin-top:10px}
.track{position:relative;height:44px;border-radius:22px;background:var(--soft);margin:8px 0 6px;touch-action:none;cursor:pointer;outline:none}
.track:focus-visible{outline:2px solid var(--acc)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:22px;background:var(--accs)}
.track .dot{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--muted);opacity:.5}
.track .thumb{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.na{border:none;background:none;color:var(--acc);font-weight:600;padding:12px;margin:8px auto 0;display:flex;gap:6px;align-items:center}
.na.on{color:var(--new)}
.foot{margin-top:auto;padding-top:14px}
/* Analyse */
svg.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--acc)}
.sum p{margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--soft);border-radius:12px;padding:10px}.stat b{display:block;font-size:1.35rem}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20}
@media print{nav,.noprint{display:none!important}main{padding:0}}
.printonly{display:none}@media print{.printonly{display:block}}

--acc:#f0936b;--acc-ink:#1d1916;--accs:#43291f;--up:#8ccb98;--ups:#20301f;--down:#f28d7f;--downs:#3b2320;--flat:#b3a69b;--flats:#302a25;--new:#e8c15f;--news:#382d16;--chart1:#f0936b;--sig:#f5c542;--sigt:#f5c542;--sig-ink:#1d1916}}

/* Motivation */
.ring{position:relative;width:86px;height:86px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem;line-height:1.05;text-align:center}
.ring b small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.streak{font-size:1.5rem;font-weight:800;color:var(--acc)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1.1)}}
.ruler button.sel{animation:pop .22s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.goalTitle.anim{animation:rise .28s ease-out}
.cele{position:fixed;inset:0;z-index:31;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.cele .box{background:var(--card);border-radius:28px;padding:26px 24px;text-align:center;max-width:320px;width:86%;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);animation:rise .3s ease-out}

@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.ruler button.sel,.goalTitle.anim,.cele .box,.cele circle.c,.cele path{animation:none;stroke-dashoffset:0}.conf{display:none}}

.pick{display:grid;gap:5px}
.pick.days{grid-template-columns:1fr 1fr 1.2fr}.pick.pauses{grid-template-columns:repeat(3,1fr)}.pick.slots{grid-template-columns:repeat(7,1fr)}.pick.subjs{grid-template-columns:repeat(4,1fr)}
.pick button,.pick select{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 2px;font:inherit;font-weight:700;font-size:.82rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick select{padding:8px 6px}
.pick .on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ctxline{width:100%;border:none;background:var(--soft);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;color:var(--ink);text-align:left}

.ruler.s5{grid-template-columns:repeat(5,1fr);gap:8px}.ruler.s5 button,.ruler.sc button{height:64px;font-size:1.4rem}.ruler.sc{gap:6px}

/* Einrichtung: rot markiert, wo man tippen soll */
.mark{outline:4px solid var(--sig)!important;outline-offset:3px;animation:markp 1.6s ease-out infinite}
@keyframes markp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sig) 60%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.marktip{color:var(--sigt);font-weight:800;margin:12px 0 8px;display:flex;gap:8px;align-items:center}
.marktip::before{content:"↓";font-size:1.2rem;line-height:1;flex:none}

.setup{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}
.setup li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.setup li.now{border:2.5px solid var(--sig)}
.setup .n{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.setup li.now .n{background:var(--sig);color:var(--sig-ink)}
.setup .do{display:block;color:var(--sigt);font-weight:800;font-size:1.08rem}
.setup .wo{display:block;color:var(--muted);font-size:.92rem;margin-top:2px}
.sym{display:inline-grid;place-items:center;vertical-align:-6px;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--ink);margin-left:2px}
.sym svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chk{list-style:none;padding:0;margin:8px 0 12px;display:grid;gap:4px}.chk li.ok{color:var(--muted);text-decoration:line-through}
.pointer{position:fixed;z-index:20;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--sigt);font-weight:800;font-size:.95rem;pointer-events:none;animation:bob 1.2s ease-in-out infinite;text-shadow:0 0 6px var(--bg)}
.pointer svg{width:44px;height:44px;stroke:var(--sig);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pointer.down{bottom:calc(4px + env(safe-area-inset-bottom,0px))}.pointer.up{top:calc(4px + env(safe-area-inset-top,0px));animation-name:bobup}
.pointer.left{left:8px}.pointer.right{right:8px}
@keyframes bob{50%{transform:translateY(7px)}}@keyframes bobup{50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.mark,.pointer{animation:none}}
/* Schriftgröße */
:root{font-size:16px}:root[data-fs=l]{font-size:18px}:root[data-fs=xl]{font-size:20px}
/* Rückgängig-Hinweis */
.toast.undo{display:flex;gap:14px;align-items:center;z-index:35;text-align:left}
.toast.undo button{border:none;background:none;color:var(--bg);font-weight:800;text-decoration:underline;padding:4px 2px;flex:none}
.kcard .late{color:var(--new);font-weight:700}
/* App-Sperre */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
#lock .box{max-width:340px;width:100%;text-align:center}
/* Touch: Tippziele mindestens 40 px */
@media (pointer:coarse){.btn.small,.btn.ghost{min-height:40px}.chip,.chips button,.catpick button{min-height:40px}button[aria-label="Schließen"],button[aria-label="Abbrechen"],.rast .x{min-width:44px;min-height:44px}}
.tdot{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;vertical-align:-3px}.tdot.sm{width:11px;height:11px;vertical-align:0;margin-right:4px}
#lock .pins{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}
#lock .pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}#lock .pins i.on{background:var(--ink)}
#lock .pins.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lock .keys{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:14px 22px;margin:12px auto 0}
#lock .keys button{height:64px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.5rem;font-weight:700}
#lock .keys button{width:70px;height:70px;padding:0}#lock .keys button.nb{border:none;background:none;font-size:.8rem;font-weight:600;color:var(--muted)}#lock .keys button.nb:last-child{font-size:1.3rem;color:var(--ink)}
body.locked #app,body.locked #nav,body.locked #overlay,body.locked #tour,body.locked .cele:not(.lockdlg),body.locked .toast{visibility:hidden}
/* Bericht für die Förderakte */
.report .meta{width:100%;margin:6px 0 10px}.report .meta td{padding:3px 8px 3px 0;vertical-align:top}.report .meta td:nth-child(odd){color:var(--muted);white-space:nowrap}
.report .rg{break-inside:avoid}
.report .dentry{break-inside:avoid}
@media print{.report h1{font-size:1.4rem;margin:0 0 4px}.report .card{border-color:#ccc;padding:10px 12px}.report svg.chart{max-height:62mm}
 :root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#fff;--card:#fff;--ink:#2b2420;--muted:#6e6259;--line:#ddd2c4;--soft:#f5ece0;--acc:#d0643c;--accs:#fbe6dc;--up:#4c8a5a;--ups:#e4f1e3;--down:#c0483a;--downs:#f9e1dc;--flat:#80736a;--flats:#f1ebe3;--new:#a7790f;--news:#f8edcf;--chart1:#d0643c}
 #lock{display:none!important}}

<body>
<main id="app"></main>
<nav id="nav" class="noprint"></nav>
<div id="overlay"></div>
<script>
"use strict";
/* ===== Speicher ===== */
const PFAD_VERSION="1.0.1",PFAD_STAND="24.10.2026";
const KEY="verlaufsbogen-v2";
const OLD_SUBJECTS=["Deutsch","Mathe","Englisch","GL","NW","Sport","AL","Kunst","Musik","Religion/PP"];
// Fächer laut schulinternen Lehrplänen auf hbg-koeln.de (Sek I), Stand 10/2026
const SUBJECTS=["Deutsch","Mathe","Englisch","Franz.","Spanisch","Latein","Türkisch","GL","NW","Bio","Chemie","Physik","WAW","Technik","HW","Info","Kunst","Musik","Sport","D&G","Rel. ev.","Rel. kath.","PP","FUF"];
// Stundenraster HBG (Schulkonferenz 11.02.2020): Name, Beginn, Ende, optional {Wochentag:[Beginn,Ende]} für abweichende Tage
const RASTER=[["0.","08:00","08:20"],["1.","08:20","09:28"],["2.","09:35","10:42"],["3.","11:10","12:18"],["4.","12:25","13:32"],["5.","14:35","15:42"]];
const OLD_RASTER=JSON.stringify([...RASTER.slice(0,5),["5.","14:35","15:42","14:00","15:07"]]);
let db;
// Mit App-Sperre liegt im Speicher nur ein verschlüsselter Umschlag {pfadEnc,salt,iv,ct}; db bleibt bis zum Entsperren leer
let ENCWAIT=null,LKEY=null;
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(db?.pfadEnc){ENCWAIT=db;db={v:2,me:"",subjects:SUBJECTS.slice(),classes:[],kids:[],lock:{salt:ENCWAIT.salt,after:ENCWAIT.after??1,len:ENCWAIT.len||4}}}
  migrate()}
function migrate(){if(!db||!db.kids)db={v:2,me:"",subjects:SUBJECTS.slice(),classes:[],kids:[]};
  if(JSON.stringify(db.subjects)===JSON.stringify(OLD_SUBJECTS))db.subjects=SUBJECTS.slice();db.raster??=RASTER.map(r=>r.slice());
  if(JSON.stringify(db.raster)===OLD_RASTER)db.raster=RASTER.map(r=>r.slice());
  db.raster.forEach(r=>{if(typeof r[3]==="string"||typeof r[4]==="string"){const d=[r[3]||"",r[4]||""];r.length=3;r[3]={2:d,5:d.slice()}}});
  db.yearSY??=syNow();
  db.kids.forEach(k=>k.goals.forEach(g=>g.entries.forEach(e=>{if(e.slot==="Pause")e.slot="Große Pause"})));
  if(db.lock?.hash){delete db.lock;setTimeout(()=>toast("Die App-Sperre verschlüsselt jetzt auch die Daten. Bitte in den Einstellungen neu einschalten."),600)}}
function applyTheme(){const t=db?.theme,r=document.documentElement;if(t==="light"||t==="dark")r.dataset.theme=t;else delete r.dataset.theme;
  if(db?.fs==="l"||db?.fs==="xl")r.dataset.fs=db.fs;else delete r.dataset.fs;
  const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);document.querySelector('meta[name=theme-color]')?.setAttribute("content",dark?"#1d1916":"#fbf6ef")}
let SAVEQ=Promise.resolve(),SAVEN=0;
function save(){if(ENCWAIT)return; // gesperrt und noch nicht entschlüsselt: nichts überschreiben
  if(db.lock&&LKEY){const n=++SAVEN,key=LKEY,json=JSON.stringify(db),meta={pfadEnc:1,salt:db.lock.salt,after:db.lock.after,len:db.lock.len};
    SAVEQ=SAVEQ.then(async()=>{const body=await gcm(key,enc(json));if(n===SAVEN)localStorage.setItem(KEY,JSON.stringify({...meta,...body}))}).catch(()=>toast("Speichern nicht möglich. Bitte exportieren."))}
  else try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Speichern nicht möglich. Bitte exportieren.")}
  window.autoSoon?.()}
/* ===== Helfer ===== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(x,d=1)=>x==null||isNaN(x)?"–":x.toFixed(d).replace(".",",");
const dDE=s=>s?s.slice(8,10)+"."+s.slice(5,7)+".":"";
const dDEy=s=>s?dDE(s)+s.slice(0,4):"";
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const kidById=id=>db.kids.find(k=>k.id===id);
const goalById=(k,id)=>k.goals.find(g=>g.id===id);
const looksLikeName=s=>/^[A-ZÄÖÜ][a-zäöüß]{2,}([ -][A-ZÄÖÜ][a-zäöüß]+)*$/.test(s.trim());
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),Math.max(1800,t.length*45))}
// Hinweis mit „Rückgängig“, verschwindet nach ein paar Sekunden
let UNDO_T;
function undoToast(msg,fn,ms=8000){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast undo";el.setAttribute("role","status");
  el.innerHTML=`<span class="grow">${esc(msg)}</span><button>Rückgängig</button>`;el.querySelector("button").onclick=()=>{el.remove();clearTimeout(UNDO_T);fn()};document.body.appendChild(el);clearTimeout(UNDO_T);UNDO_T=setTimeout(()=>el.remove(),ms)}
const sortE=e=>[...e].sort((a,b)=>(a.date+(a.slot||"")+a.ts).localeCompare(b.date+(b.slot||"")+b.ts));
const rated=g=>sortE(g.entries).filter(e=>e.value!=null);
const SCALES={"10":"10-stufig (0 bis 10)","5":"5-stufig (1 bis 5)","2":"ja / nein","c":"eigene Skala"};
const sc=g=>g.scale||"10";
// Intern immer 0–10. rng = sichtbarer Bereich der Skala (eigene Skala: lo bis hi)
const rng=g=>{const x=sc(g);return x==="5"?[1,5]:x==="c"?[+(g.lo??1),+(g.hi??7)]:[0,10]};
const toK=(g,v)=>{const [a,b]=rng(g);return a+v/10*(b-a)},fromK=(g,k)=>{const [a,b]=rng(g);return (k-a)/(b-a)*10};
const scaleName=g=>sc(g)==="c"?`eigene Skala (${rng(g).join(" bis ")})`:SCALES[sc(g)];
function scaleOpts(g){const x=sc(g);if(x==="2")return [{v:0,l:g.a0||"nein"},{v:10,l:g.a10||"ja"}];const [a,b]=rng(g);return [...Array(b-a+1)].map((_,i)=>({v:fromK(g,a+i),l:String(a+i)}))}
function dv(g,v){if(v==null)return "nicht beobachtet";return sc(g)==="2"?(v>=5?(g.a10||"ja"):(g.a0||"nein")):String(Math.round(toK(g,v)))}
function fm(g,m){if(m==null||isNaN(m))return "–";return sc(g)==="2"?Math.round(m*10)+" %":num(toK(g,m))}
function tgt(g){if(g.target==="")return "";return sc(g)==="2"?Math.round(g.target*10)+" %":String(Math.round(toK(g,g.target)))}
const better=(g,x,y)=>g.dir==="down"?x<y:x>y; // ist x besser als y?

/* ===== Einfache Trends ===== */
function trend(g){
  const v=rated(g).map(e=>e.value);
  if(v.length<6)return {k:"neu",t:"noch zu wenig Daten",n:v.length};
  // Mit Förderbeginn: vorher vs. seitdem (je bis zu 5 Werte), sonst: letzte 5 vs. 5 davor
  const r=rated(g),pre=g.start?r.filter(e=>e.date<g.start).map(e=>e.value):[],post=g.start?r.filter(e=>e.date>=g.start).map(e=>e.value):[];
  const byStart=pre.length>=3&&post.length>=3;
  const mL=byStart?mean(post.slice(-5)):mean(v.slice(-5)),mP=byStart?mean(pre.slice(-5)):mean(v.slice(-10,-5)),d=(mL-mP)*(g.dir==="down"?-1:1);
  const k=d>=1?"besser":d<=-1?"schlechter":"stabil";
  return {k,t:{besser:"läuft besser",schlechter:"wird schwieriger",stabil:"gleichbleibend"}[k],mL,mP,byStart};
}
function kidTrend(k){
  const t=k.goals.map(trend).filter(x=>x.k!=="neu").map(x=>x.k);
  if(!t.length)return {k:"neu",t:k.goals.length?"noch zu wenig Daten":"ohne Ziel"};
  if(t.includes("besser")&&t.includes("schlechter"))return {k:"gemischt",t:"unterschiedlich"};
  if(t.includes("besser"))return {k:"besser",t:"läuft besser"};
  if(t.includes("schlechter"))return {k:"schlechter",t:"wird schwieriger"};
  return {k:"stabil",t:"gleichbleibend"};
}
const ARROW={besser:"↗",schlechter:"↘",stabil:"→",gemischt:"↕",neu:"…"};
const badge=t=>`<span class="trend t-${t.k}"><i></i>${t.t}</span>`;
// Neutrale Symbole: nichts, was auf Hobby, Herkunft, Religion oder Aussehen eines Kindes schließen lässt
const ICONS=["🦊","🐢","🦉","🐝","🐬","🦋","🐙","🦒","🐧","🦔","🐳","🦜","🐌","🐞","🦁","🐼","🐨","🦓","🦩","🐸","🐠","🦀","🐘","🦭","🐿","🌻","🌵","🍀","🌲","🍄","🌈","⭐","🌙","🚀","⛵","🎈","🪁","🔑","🧭","💎","🍐","🍋","🍉","🫐","🥕","🍒"];
function freeIcon(){const used=new Set(db.kids.map(k=>k.icon)),free=ICONS.filter(i=>!used.has(i));const pool=free.length?free:ICONS;return pool[Math.floor(Math.random()*pool.length)]}
const kidIcon=(k,big)=>k.icon?`<span class="kic${big?" big":""}" style="--kc:${kidColor(k)}" aria-hidden="true">${esc(k.icon)}</span>`:`<span class="kdot" style="--kc:${kidColor(k)}${big?";width:22px;height:22px":""}"></span>`;
async function pickIcon(cur){const used=new Set(db.kids.map(k=>k.icon));
  return dlg(`<p style="font-weight:700;margin:0 0 4px">Symbol wählen</p><p class="small muted" style="margin:0 0 10px">Bitte zufällig wählen, nicht passend zum Kind. Grau = schon vergeben.</p>
  <div class="icgrid">${ICONS.map(i=>`<button data-i="${i}" class="${i===cur?"on":""}${used.has(i)&&i!==cur?" used":""}">${i}</button>`).join("")}</div>
  <div class="duo" style="margin-top:12px"><button class="btn" data-a="0">Abbrechen</button><button class="btn" data-a="r">Zufällig</button></div>`,
  (el,done)=>{el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>done(b.dataset.i));el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="r"]').onclick=()=>done(freeIcon())})}
async function setKidIcon(id){const k=kidById(id),i=await pickIcon(k.icon);if(!i)return;k.icon=i;k.upd=Date.now();save();render()}
async function newKidIcon(){const b=$("#nicon"),i=await pickIcon(b.dataset.i);if(i){b.dataset.i=i;b.textContent=i}}
const kidColor=k=>{let h=0;for(const c of k.id+k.code)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 60%)`};

/* ===== Navigation ===== */
let view={tab:"heute"};
const ICON={
heute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
klassen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4-.2 4 1.3 4.5 4.3"/></svg>',
analyse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v16h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
profil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.9-4 3.8-6 7.5-6s6.6 2 7.5 6"/></svg>'};
function renderNav(){$("#nav").innerHTML=[["heute","Heute"],["klassen","Kinder"],["analyse","Verlauf"],["profil","Einstellungen"]].map(([k,t])=>`<button class="${view.tab===k?"on":""}" ${view.tab===k?'aria-current="page"':""} onclick="go({tab:'${k}'})">${ICON[k].replace("<svg ",'<svg aria-hidden="true" ')}${t}</button>`).join("")}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  renderNav();
  const a=$("#app"),inst=setupMode();$("#nav").style.display=inst?"none":"";
  if(inst)a.innerHTML=installV();
  else if(view.report)a.innerHTML=reportV();
  else if(view.talk)a.innerHTML=talkV();
  else if(view.goal!==undefined)a.innerHTML=goalEditV();
  else if(view.imp)a.innerHTML=importV();
  else if(view.kid)a.innerHTML=kidV();
  else a.innerHTML={heute:heuteV,klassen:klassenV,analyse:analyseV,profil:profilV}[view.tab]();
  if(view.mark)requestAnimationFrame(()=>$("#app .mark")?.scrollIntoView({block:"center",behavior:"smooth"}));
  $("#pg").textContent=view.report?"@page{size:A4 portrait;margin:12mm 14mm}":"";
  tourApply();
}



/* ===== Eigene Dialoge (funktionieren auch in App-Vorschauen, wo confirm/prompt blockiert sind) ===== */
function dlg(html,onMount){return new Promise(res=>{const el=document.createElement("div");el.className="cele"+(LOCKED?" lockdlg":"");el.style.zIndex=LOCKED?120:40;
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true" style="text-align:left">${html}</div>`;document.body.appendChild(el);
  const done=v=>{el.remove();res(v)};el.onclick=e=>{if(e.target===el)done(null)};onMount(el,done)})}
async function ask(msg,o={}){const r=await dlg(`<p style="font-weight:700;font-size:1.05rem;margin:0 0 16px">${esc(msg)}</p>
  <div class="duo"><button class="btn" data-a="0">${esc(o.cancel||"Abbrechen")}</button><button class="btn pri" data-a="1" style="${o.danger?"background:var(--down);border-color:var(--down)":""}">${esc(o.ok||"OK")}</button></div>`,
  (el,done)=>{el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>done(b.dataset.a==="1"));el.querySelector('[data-a="1"]').focus()});return r===true}
async function askText(msg,ph,type){return dlg(`<p style="font-weight:700;margin:0 0 10px">${esc(msg)}</p><input id="dlgIn" type="${type||"text"}" autocomplete="${type==="password"?"current-password":"off"}" placeholder="${esc(ph||"")}">

const demoCard=()=>[...document.querySelectorAll("#app .kcard")].find(c=>c.textContent.includes(demoKid()?.code||"\u0000"));
const TOUR=[
 {v:()=>({tab:"heute"}),sel:()=>$("#nav")},
 {v:()=>({tab:"klassen"}),sel:()=>findBtn("+ Kind anlegen")},
 {v:()=>({tab:"klassen",kid:demoKid().id}),sel:()=>findBtn("+ Verhalten")},

function openHelp(){db.seenHelp=1;demo(true);save();tourGo(0)}
function tourGo(i){if(i<0)return;if(i>=TOUR.length)return tourEnd(true);if(!demoKid())demo(true);go({...TOUR[i].v(),tour:i})}
function tourEnd(done){const back=view.tour!=null?view.tab:"heute";view={tab:"heute"};render();window.scrollTo(0,0);if(done)toast("Fertig! Den Beispielfall löschst du beim Kind, wenn du ihn nicht mehr brauchst.")}
function tourApply(){let el=$("#tour");document.body.classList.toggle("touring",view.tour!=null);
  document.querySelectorAll(".tmark").forEach(x=>x.classList.remove("tmark","mark"));
  if(view.tour==null){el?.remove();return}
  const i=view.tour,h=HELP[i],last=i===TOUR.length-1;
  if(!el){el=document.createElement("div");el.id="tour";el.setAttribute("role","dialog");el.setAttribute("aria-label","Anleitung");document.body.appendChild(el)}
  el.innerHTML=`<div class="between"><span class="small muted">Anleitung · Schritt ${i+1} von ${TOUR.length}</span><button class="btn ghost small" onclick="tourEnd()">Beenden</button></div>
  <div class="dots" style="margin:6px 0 8px">${TOUR.map((_,j)=>`<button class="${j===i?"on":""}" aria-label="Schritt ${j+1}" onclick="tourGo(${j})"></button>`).join("")}</div>
  <b style="font-size:1.1rem">${h.t}</b><p class="small" style="margin:6px 0">${h.p}</p><ul class="small">${h.l.map(x=>`<li>${x}</li>`).join("")}</ul>
  <p class="row" style="margin:10px 0 0">${i?`<button class="btn ghost" onclick="tourGo(${i-1})">Zurück</button>`:""}<span class="grow"></span><button class="btn pri" onclick="tourGo(${i+1})">${last?"Fertig":"Weiter"}</button></p>`;
  requestAnimationFrame(()=>{const t=TOUR[i].sel?.();if(!t)return;t.classList.add("tmark","mark");
    if(t.id!=="nav"){const r=t.getBoundingClientRect(),room=innerHeight-el.offsetHeight-70;window.scrollTo({top:Math.max(0,r.top+scrollY-Math.max(16,(room-r.height)/2)),behavior:"smooth"})}})}

/* ===== Klassen ===== */
function klassenV(){
  const f=view.filter??"alle";
  const count=c=>db.kids.filter(k=>c==="alle"||(c===""?!k.cls:k.cls===c)).length;
  const list=db.kids.filter(k=>f==="alle"||(f===""?!k.cls:k.cls===f)).sort((a,b)=>a.code.localeCompare(b.code));
  let h=`<h1>Kinder</h1>
  <div class="row" style="margin-bottom:12px"><select style="flex:1" onchange="view.filter=this.value;render()"><option value="alle" ${f==="alle"?"selected":""}>Alle Klassen (${count("alle")})</option>
  ${db.classes.map(c=>`<option value="${esc(c)}" ${f===c?"selected":""}>Klasse ${esc(c)} (${count(c)})</option>`).join("")}
  ${count("")?`<option value="" ${f===""?"selected":""}>ohne Klasse (${count("")})</option>`:""}</select>
  <button class="btn noprint" onclick="addClass()">Neue Klasse</button></div>`;
  if(view.adding)h+=`<div class="card"><div style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center"><label style="margin-top:0">Symbol</label><label style="margin-top:0">Kürzel</label><button id="nicon" class="kic big icpick" data-i="${view.newIcon||(view.newIcon=freeIcon())}" onclick="newKidIcon()" aria-label="Symbol ändern">${view.newIcon}</button><div><input id="ncode" value="${f&&f!=="alle"?newCode(f):""}" placeholder="z. B. 8A-01" oninput="this.dataset.auto='';$('#nw').hidden=!looksLikeName(this.value)" data-auto="1"></div></div>
  <div class="sub" style="margin-top:4px">Symbol zum schnellen Wiedererkennen, zufällig gewählt. Kürzel: Klasse und laufende Nummer, keine Namen oder Initialen. Die Zuordnung steht nur in der Förderakte.</div>
  <p id="nw" class="small" style="color:var(--down)" hidden>Das sieht nach einem Namen aus. Bitte ein Kürzel verwenden.</p>
  <label>Klasse</label><select id="ncls" onchange="const i=$('#ncode');if(this.value&&(i.dataset.auto||!i.value)){i.value=newCode(this.value);i.dataset.auto='1'}"><option value="">Ohne Klasse</option>${db.classes.map(c=>`<option ${c===f?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <p style="margin-top:12px" class="row"><button class="btn pri" onclick="addKid()">Anlegen</button><button class="btn ghost" onclick="view.adding=false;render()">Abbrechen</button></p></div>`;
  if(!list.length&&!view.adding)h+=`<p class="muted">Hier ist noch niemand. Lege unten ein Kind mit Kürzel an.</p>`;
  for(const k of list)h+=`<div class="card tap row kcard" style="--kc:${kidColor(k)}" onclick="go({tab:'klassen',kid:'${k.id}'})">${kidIcon(k)}
  <div class="grow"><div class="code">${esc(k.code)} ${k.demo?'<span class="tag">fiktiv</span>':""}${k.closed?'<span class="tag">abgeschlossen</span>':""}</div><div class="muted small">${k.cls?esc(k.cls)+" · ":""}${k.goals.length} ${k.goals.length===1?"Verhalten":"Verhalten"}</div></div>${badge(kidTrend(k))}</div>`;
  if(!view.adding)h+=`<p style="margin-top:14px"><button class="btn block noprint" onclick="view.adding=true;render();$('#ncode').focus()">+ Kind anlegen</button></p>`;
  h+=`<p class="muted small" style="text-align:center">Nur Kürzel verwenden, keine Namen.</p>`;
  return h;
}
async function addClass(){const c=((await askText("Name der neuen Klasse","z. B. 7B"))||"").trim();if(!c)return;if(!db.classes.includes(c))db.classes.push(c);db.classes.sort();save();view.filter=c;render()}
function newCode(cls){let n=1,c;do{c=`${cls}-${String(n++).padStart(2,"0")}`}while(db.kids.some(k=>k.code.toLowerCase()===c.toLowerCase()));return c}
async function addKid(){const code=$("#ncode").value.trim();if(!code)return toast("Bitte ein Kürzel eingeben.");
  if(looksLikeName(code)&&!await ask("Das Kürzel sieht nach einem Namen aus. Trotzdem speichern?",{ok:"Trotzdem speichern"}))return;
  const k={id:uid(),code,icon:$("#nicon").dataset.i,cls:$("#ncls").value,goals:[],diary:[],ts:Date.now()};db.yearSY??=syNow();delete view.newIcon;db.kids.push(k);save();go({tab:"klassen",kid:k.id})}

/* ===== Kind ===== */
function spark(g){
  const v=rated(g).slice(-12).map(e=>e.value);if(v.length<2)return "";
  const W=90,H=28,x=i=>i*(W-4)/(v.length-1)+2,y=val=>H-2-val/10*(H-4);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" points="${v.map((a,i)=>x(i)+","+y(a)).join(" ")}"/></svg>`;
}
function kidV(){
  const k=kidById(view.kid);if(!k){view={tab:"klassen"};return klassenV()}
  let h=`<button class="btn ghost noprint" onclick="go({tab:'${view.tab}'})">‹ Zurück</button>
  <div class="row" style="margin:6px 0 4px"><button class="icbtn" aria-label="Symbol ändern" onclick="setKidIcon('${k.id}')">${k.icon?kidIcon(k,1):`<span class="kic big add" style="--kc:${kidColor(k)}">+</span>`}</button><div class="grow"><div class="code" style="font-size:1.4rem">${esc(k.code)}</div>
  <select class="chip" style="margin-top:4px;width:auto" onchange="Object.assign(kidById('${k.id}'),{cls:this.value,upd:Date.now()});save();render()"><option value="">Ohne Klasse</option>${db.classes.map(c=>`<option ${c===k.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>${badge(kidTrend(k))}</div>
  ${k.closed?`<div class="card" style="border:2px solid var(--new);margin-top:12px"><b>Förderung abgeschlossen am ${dDEy(k.closed)}</b><p class="small" style="margin:6px 0 10px">Das Kind erscheint nicht mehr auf „Heute“. Lege den Bericht in die Förderakte und lösche die Daten danach von diesem Gerät.${k.delAt?` Pfad erinnert dich am ${dDEy(k.delAt)}.`:""}</p>
  <p class="row" style="flex-wrap:wrap;margin:0"><button class="btn pri" onclick="go({tab:'${view.tab}',kid:'${k.id}',report:true})">Bericht (PDF)</button><button class="btn danger" onclick="delKid('${k.id}')">Jetzt löschen</button><button class="btn ghost" onclick="reopenKid('${k.id}')">Wieder aufnehmen</button></p></div>`:""}
  ${k.goals.length&&!k.closed?`<div class="duo" style="margin:14px 0;grid-template-columns:1fr 1fr"><button class="btn pri" onclick="startRate('${k.id}')">Jetzt bewerten</button><button class="btn" onclick="go({tab:'${view.tab}',kid:'${k.id}',talk:true})">Gesprächsblatt</button></div>`:""}
  <h2>Verhalten</h2>`;
  if(!k.goals.length)h+=`<p class="muted">Noch kein Verhalten angelegt. Übernimm am besten ein Förderziel aus dem Förderplan.</p>`;
  for(const g of k.goals){const t=trend(g),n=rated(g).length;
    h+=`<div class="card"><div class="between"><div class="grow"><b>${esc(g.title)}</b><div class="muted small">${g.dir==="down"?"weniger davon":"mehr davon"} · ${n} Einschätzung${n===1?"":"en"}</div></div>${spark(g)}</div>
    <div class="between" style="margin-top:8px">${badge(t)}<span><button class="btn ghost" onclick="go({tab:'analyse',aKid:'${k.id}',aGoal:'${g.id}'})">Verlauf</button><button class="btn ghost" onclick="go({tab:'${view.tab}',kid:'${k.id}',goal:'${g.id}'})">Bearbeiten</button></span></div></div>`}
  h+=`<p><button class="btn block" onclick="go({tab:'${view.tab}',kid:'${k.id}',goal:''})">+ Verhalten</button></p>`+diaryV(k)+`
  <div class="card noprint row"><div class="grow small"><b>Mit Kolleg:in teilen</b><br><span class="muted">Verschlüsselte Datei nur mit diesem Kind.</span></div><button class="btn" onclick="shareKids('${k.id}')">Teilen</button></div>
  ${srvKidCard(k)}
  ${k.goals.length?`<div class="card noprint row"><div class="grow small"><b>Bericht für die Förderakte</b><br><span class="muted">Verlauf, Auswertung und Tagebuch als PDF.</span></div><button class="btn" onclick="go({tab:'${view.tab}',kid:'${k.id}',report:true})">Bericht</button></div>`:""}
  ${k.closed||k.demo?"":`<div class="card noprint row"><div class="grow small"><b>Förderung abschließen</b><br><span class="muted">Zum Beispiel am Schuljahresende oder bei Schulwechsel.</span></div><button class="btn" onclick="closeKid('${k.id}')">Abschließen</button></div>`}
  <p class="noprint" style="margin-top:24px"><button class="btn ghost danger" onclick="delKid('${k.id}')">Kind und alle Einschätzungen löschen</button></p>`;
  return h;
}
async function closeKid(id){const k=kidById(id);
  const r=await dlg(`<p style="font-weight:700;font-size:1.05rem;margin:0 0 8px">Förderung für ${esc(k.code)} abschließen?</p>
  <ol class="small" style="padding-left:20px;margin:0 0 10px"><li style="margin:5px 0">Pfad erstellt den Bericht mit Verlauf, Auswertung und Tagebuch. Speichere ihn als PDF und lege ihn in die Förderakte.</li><li style="margin:5px 0">Danach löschst du ${esc(k.code)} von diesem Gerät. Pfad erinnert dich in 4 Wochen daran.</li></ol>
  <p class="small muted" style="margin:0 0 14px">Bis dahin erscheint ${esc(k.code)} nicht mehr auf „Heute“. Du kannst die Förderung jederzeit wieder aufnehmen.</p>
  <div class="duo"><button class="btn" data-a="0">Abbrechen</button><button class="btn pri" data-a="1">Abschließen</button></div>`,(el,done)=>{el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>done(b.dataset.a==="1"))});
  if(r!==true)return;Object.assign(k,{closed:today(),delAt:addDays(today(),28),upd:Date.now()});save();go({tab:view.tab,kid:id,report:true});toast("Abgeschlossen. Jetzt den Bericht als PDF sichern.")}
function reopenKid(id){const k=kidById(id);delete k.closed;delete k.delAt;k.upd=Date.now();save();render();toast(`${k.code} ist wieder aktiv`)}
async function delKid(id){if(!await ask(`Kind mit allen Zielen, Einschätzungen und Tagebucheinträgen von diesem Gerät löschen? ${kidById(id)?.srv?"Auf dem Schulserver bleibt es für die anderen erhalten.":""}`,{ok:"Löschen",danger:true}))return;db.kids=db.kids.filter(k=>k.id!==id);save();go({tab:"klassen"})}

/* ===== Verhalten bearbeiten ===== */
let draft=null;
function goalEditV(){
  const k=kidById(view.kid);
  if(!draft||draft._for!==view.goal+k.id){const g=view.goal?goalById(k,view.goal):null;
    draft=g?{...g,locked:g.entries.length>0}:{title:"",fp:"",how:"",dir:"down",a0:"nie",a10:"ständig",target:"",start:"",scale:"10"};draft._for=view.goal+k.id}
  const d=draft;
  return `<div class="between"><button class="btn ghost" aria-label="Abbrechen" style="font-size:1.3rem" onclick="draft=null;go({tab:'${view.tab}',kid:'${k.id}'})">✕</button><b>${view.goal?"Verhalten bearbeiten":"Neues Verhalten"}</b><span style="width:30px"></span></div>
  <label>Verhalten</label><div class="sub">Kurz, so wie es beim Bewerten oben stehen soll.</div>
  <input id="ft" value="${esc(d.title)}" placeholder="z. B. Stört den Unterricht" oninput="draft.title=this.value">
  <label>Woran erkennst du es?</label><div class="sub">Damit alle, die bewerten, dasselbe meinen.</div>
  <textarea id="fh" placeholder="z. B. Ruft rein, verlässt den Platz ohne Erlaubnis, lenkt Mitschüler:innen ab." oninput="draft.how=this.value">${esc(d.how)}</textarea>
  <details class="tip" style="margin-top:8px"><summary>So wird das Verhalten gut beobachtbar</summary>
  <p>Beschreibe, was man sehen oder hören kann. Nicht „ist unkonzentriert“, sondern „arbeitet 10 Minuten am Platz, ohne aufzustehen“.</p>
  <p>Lieber zwei kleine Verhaltensweisen als eine große.</p></details>
  <label>Was soll sich ändern?</label>
  <div class="toggle"><button class="${d.dir==="down"?"on":""}" onclick="setDir('down')">Weniger davon</button><button class="${d.dir==="up"?"on":""}" onclick="setDir('up')">Mehr davon</button></div>
  <label>Skala</label>${d.locked?`<input value="${scaleName(d)}" disabled><div class="sub" style="margin-top:6px">Die Skala ist fest, weil es schon Einschätzungen gibt. So bleibt alles vergleichbar.</div>`
   :`<div class="toggle">${Object.entries(SCALES).map(([key,t])=>`<button class="${sc(d)===key?"on":""}" onclick="setScale('${key}')">${t.replace(/ \(.*\)/,"")}<br><span class="small" style="font-weight:400">${key==="10"?"0 bis 10":key==="5"?"1 bis 5":key==="2"?"zwei Knöpfe":"Bereich selbst wählen"}</span></button>`).join("")}</div>
   ${sc(d)==="c"?`<div class="two" style="margin-top:10px"><div><div class="sub">Kleinster Wert</div><select onchange="draft.lo=+this.value;if(draft.hi-draft.lo<2)draft.hi=draft.lo+2;draft.tIn=undefined;draft.target='';render()">${[0,1].map(v=>`<option ${+d.lo===v?"selected":""}>${v}</option>`).join("")}</select></div>
   <div><div class="sub">Größter Wert</div><select onchange="draft.hi=+this.value;draft.tIn=undefined;draft.target='';render()">${[...Array(9)].map((_,i)=>i+2).filter(v=>v-d.lo>=2&&v-d.lo<=10).map(v=>`<option ${+d.hi===v?"selected":""}>${v}</option>`).join("")}</select></div></div>
   <div class="sub" style="margin-top:6px">Beim Bewerten gibt es dann die Knöpfe ${rng(d)[0]} bis ${rng(d)[1]}.</div>`:""}`}
  <label>${sc(d)==="2"?"Beschriftung der Knöpfe":`Was bedeuten ${rng(d)[0]} und ${rng(d)[1]}?`}</label>
  <div class="two"><div><div class="sub">${sc(d)==="2"?"Knopf „nicht gezeigt“":rng(d)[0]+" heißt …"}</div><input value="${esc(d.a0)}" oninput="draft.a0=this.value"></div><div><div class="sub">${sc(d)==="2"?"Knopf „gezeigt“":rng(d)[1]+" heißt …"}</div><input value="${esc(d.a10)}" oninput="draft.a10=this.value"></div></div>
  <label>Bezug zum Förderplan <span class="sub">(optional)</span></label>
  <textarea placeholder="Förderziel aus dem Förderplan einfügen" oninput="draft.fp=this.value">${esc(d.fp)}</textarea>
  <div class="two"><div><label>Ziel ist erreicht bei <span class="sub">(optional${sc(d)==="2"?", in % der Stunden":""})</span></label><input type="number" min="${sc(d)==="2"?0:rng(d)[0]}" max="${sc(d)==="2"?100:rng(d)[1]}" inputmode="numeric" value="${esc(d.tIn??(d.target===""?"":tgt(d).replace(" %","")))}" placeholder="${sc(d)==="2"?(d.dir==="down"?"z. B. höchstens 20":"z. B. mindestens 80"):sc(d)==="5"?(d.dir==="down"?"z. B. höchstens 2":"z. B. mindestens 4"):(d.dir==="down"?"z. B. höchstens 3":"z. B. mindestens 7")}" oninput="draft.tIn=this.value"></div>
  <div><label>Förderung startet am <span class="sub">(optional)</span></label><input type="date" value="${esc(d.start)}" oninput="draft.start=this.value"></div></div>
  <div class="sub" style="margin-top:6px"><b>Förderung startet am:</b> der Tag, ab dem eine neue Maßnahme gilt, z. B. ein Verstärkerplan oder ein neuer Sitzplatz. Davor beobachtest du nur, wie es ist. Pfad zieht im Verlauf eine Linie an diesem Tag und vergleicht die Werte davor und danach. Leer lassen, wenn es keinen festen Beginn gibt.</div>
  <p style="margin-top:18px"><button class="btn pri block" onclick="saveGoal()">Speichern</button></p>
  ${view.goal?`<p><button class="btn ghost danger" onclick="delGoal()">Verhalten löschen</button></p>`:""}`;
}
function setScale(x){const d=draft,was=sc(d);d.scale=x;d.tIn=undefined;d.target="";if(x==="c"){d.lo??=1;d.hi??=7}
  if(x==="2"&&was!=="2"){d._a=[d.a0,d.a10];d.a0="nicht gezeigt";d.a10="gezeigt"}else if(was==="2"&&x!=="2"&&d._a){[d.a0,d.a10]=d._a}render()}

const RANGES={w4:["letzte 4 Wochen",27],w8:["letzte 8 Wochen",55],all:["gesamter Zeitraum",null]};
const wkStart=d=>{while(new Date(d+"T12:00").getDay()!==1)d=addDays(d,-1);return d};
function weekBars(g,from){
  const m={};rated(g).filter(e=>!from||e.date>=from).forEach(e=>{(m[wkStart(e.date)]??=[]).push(e.value)});
  return Object.keys(m).sort().slice(-8).map(w=>({w,v:mean(m[w]),n:m[w].length}));
}
function barSvg(g,wk){
  const W=340,H=170,T=22,B=26,n=wk.length,bw=Math.min(46,(W-20)/n-10),gap=(W-n*bw)/(n+1),Y=v=>T+(1-v/10)*(H-T-B);
  const meets=v=>g.target!==""&&(g.dir==="down"?v<=g.target:v>=g.target);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Wochenwerte">`;
  s+=`<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="2"/>`;
  wk.forEach((x,i)=>{const X=gap+i*(bw+gap),y=Y(x.v);
    s+=`<rect x="${X}" y="${y}" width="${bw}" height="${Y(0)-y}" rx="10" fill="${meets(x.v)?"var(--up)":"var(--acc)"}" opacity="${i===n-1?1:.55}"/>
    <text x="${X+bw/2}" y="${y-6}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">${fm(g,x.v)}</text>
    <text x="${X+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${i===n-1?"jetzt":dDE(x.w)}</text>`});
  if(g.target!==""){const y=Y(g.target);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--up)" stroke-width="2.5" stroke-dasharray="6 5"/><text x="${W}" y="${y-5}" text-anchor="end" font-size="12" font-weight="700" fill="var(--up)">Ziel</text>`}
  return s+"</svg>";
}

const CATCOL={Notiz:"--chart1",Erfolg:"--up",Vorfall:"--down",Gespräch:"--acc",Elternkontakt:"--acc",Absprache:"--new",Beobachtung:"--muted"};
function chart(g,k,max=30){
  const e=sortE(g.entries).slice(-max);if(!e.length)return '<p class="muted">Noch keine Einschätzungen.</p>';
  const W=innerWidth<600?420:600,H=236,L=26,R=8,T=30,B=26;
  const X=i=>e.length===1?(L+W-R)/2:L+i*(W-L-R)/(e.length-1),Y=v=>T+(1-v/10)*(H-T-B);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf: ${esc(g.title)}, ${e.length} Einschätzungen, Tendenz ${esc(trend(g).t)}">`;
  [0,5,10].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${sc(g)==="2"?(v===10?"ja":v===0?"nein":""):num(toK(g,v))}</text>`);
  if(g.target!==""){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(g.target)}" y2="${Y(g.target)}" stroke="var(--up)" stroke-dasharray="3 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(g.target)-5}" font-size="11" text-anchor="end" fill="var(--up)">Ziel</text>`}
  if(g.start){const i=e.findIndex(x=>x.date>=g.start);if(i>0){const xs=(X(i-1)+X(i))/2;s+=`<line x1="${xs}" x2="${xs}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${xs+5}" y="${T+10}" font-size="11" fill="var(--muted)">Förderung</text>`}}
  const pts=e.map((x,i)=>x.value==null?null:[X(i),Y(x.value)]);
  s+=`<polyline fill="none" stroke="var(--chart1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.filter(Boolean).map(p=>p.join(",")).join(" ")}"/>`;
  e.forEach((x,i)=>{if(x.value==null)s+=`<circle cx="${X(i)}" cy="${H-B}" r="4" fill="none" stroke="var(--muted)"><title>${dDE(x.date)}: nicht beobachtet</title></circle>`;
    else s+=`<circle cx="${X(i)}" cy="${Y(x.value)}" r="4.5" fill="var(--chart1)" stroke="var(--card)" stroke-width="1.5"><title>${dDE(x.date)} ${esc(x.subj)}: ${esc(dv(g,x.value))}</title></circle>`});
  // Tagebucheinträge im Zeitraum als nummerierte Markierungen
  const xDate=d=>{const i=e.findIndex(x=>x.date>=d);if(i<0)return d===e[e.length-1].date?X(e.length-1):null;if(e[i].date===d)return X(i);return i===0?null:(X(i-1)+X(i))/2};
  const pins=g.entries.filter(x=>x.pin).map(x=>({id:x.id,date:x.date,ts:x.ts,cat:"Notiz",text:x.note||"(ohne Kommentar)",subj:x.subj,rater:x.rater,edited:x.edited,_e:1}));
  const marks=sortD([...(k?.diary||[]),...pins]).reverse().map(d=>({d,x:xDate(d.date)})).filter(m=>m.x!=null),used={};
  marks.forEach((m,n)=>{const col=`var(${CATCOL[m.d.cat]||"--muted"})`,key=Math.round(m.x),off=(used[key]=(used[key]||0)+1)-1,cx=Math.min(W-9,Math.max(L+9,m.x+off*15));
    s+=`<line x1="${m.x}" x2="${m.x}" y1="${T-4}" y2="${H-B}" stroke="${col}" stroke-width="1" opacity=".45"/>
    <g style="cursor:pointer" onclick="const el=document.getElementById('dn${n+1}');el.scrollIntoView({block:'center'});el.animate([{background:'var(--accs)'},{background:'transparent'}],1200)"><circle cx="${cx}" cy="${T-14}" r="8" fill="${col}"/><text x="${cx}" y="${T-10.5}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--card)">${n+1}</text><title>${dDE(m.d.date)} ${esc(m.d.cat)}: ${esc(m.d.text)}</title></g>`});
  chart.marks=marks;
  const step=Math.max(1,Math.ceil(e.length/6));
  e.forEach((x,i)=>{if(i%step===0||i===e.length-1)s+=`<text x="${X(i)}" y="${H-7}" font-size="11" text-anchor="${i===e.length-1?"end":i===0?"start":"middle"}" fill="var(--muted)">${dDE(x.date)}</text>`});
  s+="</svg>"+(e.some(x=>x.value==null)?'<p class="muted small">○ auf der Grundlinie = nicht beobachtet</p>':"");
  if(marks.length)s+=`<h2 style="margin:14px 0 4px;font-size:1rem">Notizen im Zeitraum</h2>`+marks.map((m,n)=>`<div class="dentry" id="dn${n+1}" style="display:flex;gap:10px"><span style="flex:none;width:20px;height:20px;border-radius:50%;background:var(${CATCOL[m.d.cat]||"--muted"});color:var(--card);font-size:.75rem;font-weight:700;display:grid;place-items:center;margin-top:2px">${n+1}</span><div class="grow">${dItem(m.d).replace('<div class="dentry">','<div>')}<button class="btn ghost small noprint" style="padding:2px 0" onclick="${m.d._e?`editEntry('${m.d.id}')`:`editDiary('${k.id}','${m.d.id}')`}">bearbeiten</button></div></div>`).join("");
  return s;
}
function groupTable(g,key,label){
  const m={};rated(g).forEach(e=>{const k=e[key]||"";if(!k)return;(m[k]??=[]).push(e.value)});
  const rows=Object.entries(m).filter(([,v])=>v.length>=2).map(([k,v])=>[k,mean(v),v.length]);
  if(rows.length<2)return {html:"",best:null,worst:null};
  rows.sort((a,b)=>g.dir==="down"?a[1]-b[1]:b[1]-a[1]);
  return {best:rows[0],worst:rows[rows.length-1],html:`<table><tr><th>${label}</th><th>Ø</th><th style="width:40%"></th><th>n</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${fm(g,r[1])}</td><td><div class="bar" style="width:${r[1]*10}%"></div></td><td class="muted">${r[2]}</td></tr>`).join("")}</table>`};
}
function summary(k,g){
  const r=rated(g),all=g.entries,na=all.filter(e=>e.value==null).length,t=trend(g),out=[];
  if(!r.length)return {lines:["Noch keine Einschätzungen."],text:""};
  const first=sortE(all)[0].date,last=sortE(all).slice(-1)[0].date;
  out.push(`${r.length} Einschätzung${r.length===1?"":"en"} vom ${dDEy(first)} bis ${dDEy(last)}${na?`, dazu ${na}-mal nicht beobachtet`:""}.`);
  if(t.k==="neu")out.push(`Für einen Trend braucht es mindestens 6 Einschätzungen. Bisher sind es ${r.length}.`);
  else out.push(`${t.byStart?`Die letzten 5 Einschätzungen vor Förderbeginn (${dDEy(g.start)}) lagen im Schnitt bei ${fm(g,t.mP)}, die letzten 5 seitdem bei ${fm(g,t.mL)}.`:`Die letzten 5 Einschätzungen liegen im Schnitt bei ${fm(g,t.mL)}, die 5 davor bei ${fm(g,t.mP)}.`} <b>${t.k==="besser"?"Das Verhalten entwickelt sich eher in die gewünschte Richtung.":t.k==="schlechter"?"Das Verhalten entwickelt sich eher in die falsche Richtung.":"Das Verhalten ist ungefähr gleich geblieben."}</b>`);
  if(g.target!==""){const l5=r.slice(-5),hit=l5.filter(e=>g.dir==="down"?e.value<=g.target:e.value>=g.target).length;
    out.push(`Ziel (${g.dir==="down"?"höchstens":"mindestens"} ${tgt(g)}): in ${hit} der letzten ${l5.length} Einschätzungen erreicht.${hit>=4&&l5.length>=5?" <b>Das Ziel kann als erreicht gelten.</b>":""}`)}
  const bs=groupTable(g,"subj","Fach"),bt=groupTable(g,"slot","Stunde");
  if(bs.best)out.push(`Am besten läuft es in ${esc(bs.best[0])} (Ø ${fm(g,bs.best[1])}), am schwierigsten in ${esc(bs.worst[0])} (Ø ${fm(g,bs.worst[1])}).`);
  const plain=s=>s.replace(/<[^>]+>/g,"");
  const text=`Evaluation: ${g.fp||g.title}\n`+out.map(plain).join("\n")+`\nWeiteres Vorgehen: `;
  return {lines:out,text,bs,bt};
}

/* ===== Profil ===== */
/* ===== Datenmodell für Austausch: Änderungszeiten, Löschmarken, Zusammenführen =====
   Jeder Eintrag hat eine feste id und eine Änderungszeit (ts/edited/upd). Gelöschte ids stehen in k.del.
   Zusammengeführt wird pro Kind: Neues kommt dazu, bei gleicher id gewinnt die neuere Fassung.
   Dieselbe Regel nutzt der Schulserver (server/pfad-server.mjs). */
const tomb=(k,id)=>{(k.del??=[]).includes(id)||k.del.push(id);k.delTs=Date.now()};
const ver=x=>x.edited||x.upd||x.ts||0;
function kidVer(k){return Math.max(ver(k),...k.goals.map(ver),...k.goals.flatMap(g=>g.entries.map(ver)),...(k.diary||[]).map(ver),k.delTs||0)}
function mergeList(a=[],b=[],del){const m=new Map(a.map(x=>[x.id,x]));for(const x of b){const y=m.get(x.id);if(!y||ver(x)>ver(y))m.set(x.id,x)}return [...m.values()].filter(x=>!del.has(x.id))}
function mergeKid(k,kids=db.kids,classes=db.classes){const ex=kids.find(x=>x.id===k.id);
  if(!ex){kids.push(k);if(k.cls&&!classes.includes(k.cls))classes.push(k.cls);return 1}
  const del=new Set([...(ex.del||[]),...(k.del||[])]),before=JSON.stringify(ex);
  if(ver(k)>ver(ex))Object.assign(ex,{code:k.code,cls:k.cls,upd:k.upd,...(k.icon?{icon:k.icon}:{})});
  if(k.team)ex.team=k.team;if(k.pending)ex.pending=k.pending;
  const eg=new Map(ex.goals.map(g=>[g.id,g]));
  ex.goals=mergeList(ex.goals,k.goals,del).map(g=>{const a=eg.get(g.id)?.entries||[],b=(k.goals.find(x=>x.id===g.id)||{}).entries||[];return {...g,entries:mergeList(a,b,del)}});
  ex.diary=mergeList(ex.diary,k.diary,del);ex.del=[...del];ex.delTs=Math.max(ex.delTs||0,k.delTs||0);if(ex.cls&&!classes.includes(ex.cls))classes.push(ex.cls);
  return before!==JSON.stringify(ex)?1:0}
// Was brächte ein fremder Stand für dieses Kind Neues? (für die Auswahl beim Import)
function diffKid(k){const ex=kidById(k.id);
  const cnt=x=>({goals:x.goals.length,entries:x.goals.reduce((s,g)=>s+g.entries.length,0),diary:(x.diary||[]).length});
  if(!ex)return {neu:true,...cnt(k)};
  const ids=new Map([...ex.goals,...ex.goals.flatMap(g=>g.entries),...(ex.diary||[])].map(x=>[x.id,ver(x)])),del=new Set(ex.del||[]);
  let entries=0,diary=0,goals=0,changed=0;
  for(const g of k.goals){if(del.has(g.id))continue;if(!ids.has(g.id))goals++;else if(ver(g)>ids.get(g.id))changed++;
    for(const e of g.entries){if(del.has(e.id))continue;if(!ids.has(e.id))entries++;else if(ver(e)>ids.get(e.id))changed++}}
  for(const e of k.diary||[]){if(del.has(e.id))continue;if(!ids.has(e.id))diary++;else if(ver(e)>ids.get(e.id))changed++}
  const dels=(k.del||[]).filter(id=>ids.has(id)).length;
  return {neu:false,goals,entries,diary,changed,dels,leer:!(goals+entries+diary+changed+dels)}}

async function setLock(change){if(!crypto.subtle){toast("In dieser Ansicht nicht möglich. Bitte im Browser öffnen.");return render()}
  if(change){const c=await askCode("Aktuellen Code eingeben");if(c==null)return;if(!await tryCode(c))return toast("Code falsch")}
  const a=await askCode(change?"Neuen Code festlegen":"Code für Pfad festlegen","4 bis 6 Ziffern, nicht dein Gerätecode. Du gibst ihn bei jedem Start ein. Vergessen heißt: Die Daten auf diesem Gerät sind weg. Speichere vorher eine Sicherung.");
  if(a==null)return render();if(!/^\d{4,6}$/.test(a)){render();return toast("Bitte 4 bis 6 Ziffern.")}
  if(await askCode("Code wiederholen")!==a){render();return toast("Die Codes stimmen nicht überein.")}
  const salt=b64(rnd(16));LKEY=await codeKey(a,salt);db.lock={salt,len:a.length,after:db.lock?.after??1};save();await SAVEQ;render();toast(change?"Code geändert":"Pfad ist jetzt gesperrt und verschlüsselt")}
async function offLock(){const c=await askCode("Zum Ausschalten Code eingeben","Danach liegen die Daten wieder unverschlüsselt im Speicher dieses Geräts.");
  if(c!=null&&await tryCode(c)){delete db.lock;LKEY=null;save();render();toast("App-Sperre ist aus")}else{render();if(c)toast("Code falsch")}}
function lockNow(){if(!db.lock)return;LOCKED=true;LOCKIN="";document.body.classList.add("locked");document.activeElement?.blur?.();renderLock()}
function renderLock(msg,busy){let el=$("#lock");if(!LOCKED){el?.remove();return}
  if(!el){el=document.createElement("div");el.id="lock";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Pfad ist gesperrt");document.body.appendChild(el)}
  const wait=Math.ceil((LOCKWAIT-Date.now())/1000),len=db.lock.len||4;
  el.innerHTML=`<div class="box"><div style="font-size:2.4rem" aria-hidden="true">🔒</div><h1 style="margin:6px 0 4px">Pfad ist gesperrt</h1>
  <p class="muted" aria-live="polite">${wait>0?`Zu viele Versuche. Warte ${wait} Sekunden.`:busy?"Wird entsperrt …":esc(msg||"Gib deinen Code ein.")}</p>
  <div class="pins${msg?" bad":""}" aria-hidden="true">${[...Array(len)].map((_,i)=>`<i class="${i<LOCKIN.length?"on":""}"></i>`).join("")}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockPress('${n}')">${n}</button>`).join("")}<button class="nb" onclick="lockForgot()">Vergessen?</button><button onclick="lockPress('0')">0</button><button class="nb" aria-label="Ziffer löschen" onclick="LOCKIN=LOCKIN.slice(0,-1);renderLock()">⌫</button></div></div>`;
  if(wait>0)setTimeout(()=>LOCKED&&renderLock(),1000)}
let LOCKBUSY=false;
async function lockPress(d){if(LOCKWAIT>Date.now()||LOCKBUSY)return;const len=db.lock.len||4;if(LOCKIN.length>=len)return;LOCKIN+=d;renderLock();if(LOCKIN.length<len)return;
  LOCKBUSY=true;renderLock("",true);const r=await tryCode(LOCKIN);LOCKBUSY=false;LOCKIN="";
  if(r){LOCKFAIL=0;LKEY=r.key;if(ENCWAIT){ENCWAIT=null;db=r.data;migrate();applyTheme()}LOCKED=false;document.body.classList.remove("locked");renderLock();render();return}
  LOCKFAIL++;if(LOCKFAIL>=5)LOCKWAIT=Date.now()+30000*2**(LOCKFAIL-5);try{navigator.vibrate?.(80)}catch(e){}renderLock("Falscher Code. Versuch es noch einmal.")}
async function lockForgot(){if(!await ask("Code vergessen? Ohne Code lassen sich die Daten nicht entschlüsseln. Du kannst alles auf diesem Gerät löschen und danach deine letzte Sicherung laden.",{ok:"Alles löschen",danger:true}))return;
  const keep=ENCWAIT?{}:db;ENCWAIT=null;LKEY=null;
  db={v:2,me:keep.me||"",subjects:keep.subjects||SUBJECTS.slice(),raster:keep.raster,game:keep.game,theme:keep.theme,fs:keep.fs,bsalt:keep.bsalt,yearSY:keep.yearSY,classes:[],kids:[]};migrate();
  localStorage.removeItem(KEY);save();LOCKED=false;document.body.classList.remove("locked");renderLock();applyTheme();go({tab:"profil"});toast("Alles gelöscht. Lade jetzt deine letzte Sicherung.")}
document.addEventListener("visibilitychange",()=>{if(!db?.lock)return;if(document.hidden){HIDDEN_AT=Date.now();if(!db.lock.after)lockNow()}
  else if(!LOCKED&&HIDDEN_AT&&Date.now()-HIDDEN_AT>=db.lock.after*6e4)lockNow()});
document.addEventListener("keydown",e=>{if(!LOCKED||e.target.closest?.(".cele"))return;if(/^\d$/.test(e.key))lockPress(e.key);else if(e.key==="Backspace"){LOCKIN=LOCKIN.slice(0,-1);renderLock()}});

function demo(quiet){
  if(db.kids.some(k=>k.demo))return quiet?null:toast("Beispielfall ist schon da");
  if(!db.classes.includes("7B"))db.classes.push("7B");
  const t=today(),start=addDays(t,-14);
  const g1={id:uid(),title:"Stört den Unterricht",how:"Ruft rein, verlässt ohne Erlaubnis den Platz, lenkt andere ab.",fp:"Fiktiv: Ich melde mich, bevor ich etwas sage.",dir:"down",a0:"nie",a10:"ständig",target:3,start,entries:[]};
  const g2={id:uid(),title:"Beginnt Aufgaben selbstständig",how:"Hat nach 3 Minuten das Material da und fängt an.",fp:"Fiktiv: Ich fange Aufgaben ohne Erinnerung an.",dir:"up",a0:"gar nicht",a10:"durchgehend",target:7,start,entries:[]};
  const subj=["Mathe","Deutsch","Englisch","Mathe","GL"],slot=["1. Std.","3. Std.","5. Std.","2. Std.","4. Std."];
  const v1=[7,8,6,9,7,8,7,5,6,4,null,4,3,5,3,2,3,4],v2=[3,2,4,3,3,2,4,5,5,6,null,6,7,5,7,8,7,6];
  let d=addDays(t,-27),i=0;
  while(i<v1.length){const wd=new Date(d+"T12:00").getDay();if(wd&&wd<6){const s=subj[i%5],sl=slot[i%5],ts=new Date(d+"T10:00").getTime()+i;
    const adj=s==="Deutsch"&&v1[i]!=null?1:0;
    g1.entries.push({id:uid(),date:d,slot:sl,subj:s,value:v1[i]==null?null:Math.min(10,v1[i]+adj),note:i===7?"Neuer Sitzplatz vorne am Pult.":i===10?"Kind war bei Förderstunde.":"",rater:"MU",ts,gen:true});
    g2.entries.push({id:uid(),date:d,slot:sl,subj:s,value:v2[i]==null?null:Math.max(0,v2[i]-adj),note:i===13?"Mit Wochenplan deutlich schneller gestartet.":"",rater:"MU",ts,gen:true});i++}d=addDays(d,1)}
  const diary=[[-25,"Beobachtung","Mathe","Kommt nach der Pause oft unruhig in die Stunde. Erste 10 Minuten am schwierigsten."],[-20,"Gespräch","","Kurzes Gespräch nach der Stunde: wünscht sich einen Platz weiter vorne."],[-14,"Absprache","","Mit Klassenleitung: Sitzplatz vorne, Wochenplan mit Startsignal. Ab heute Förderung."],[-9,"Elternkontakt","","Telefonat mit der Mutter: zu Hause läuft es ähnlich, Unterstützung bei Wochenplan zugesagt."],[-4,"Erfolg","Mathe","Hat heute als Erste:r angefangen und das stolz gezeigt."],[-2,"Vorfall","Deutsch","Streit in der Gruppenarbeit, Auszeit nötig. Danach wieder gut eingestiegen."]]
    .map(([o,cat,subj,text],i)=>({id:uid(),date:addDays(t,o),cat,subj,text,rater:"MU",ts:new Date(addDays(t,o)+"T15:00").getTime()+i,gen:true}));
  db.kids.push({id:uid(),code:"DEMO-7B",icon:"🦉",cls:"7B",demo:true,goals:[g1,g2],diary});save();if(quiet)return;toast("Beispielfall geladen");go(view.mark?{tab:"profil",mark:"demo"}:{tab:"klassen"})}

load();applyTheme();matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",applyTheme);if(db.lock)lockNow();render();
</script>
