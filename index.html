<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e2ddd3;--soft:#efebe3;
--acc:#2f5d8a;--acc-ink:#fff;--accs:#e3ecf5;--up:#2e7d4f;--ups:#e2f2e8;--down:#b0412e;--downs:#f8e4df;--flat:#6b665e;--flats:#ecebe7;--new:#8a6a1f;--news:#f6edd6;
--chart1:#2f5d8a;--chart2:#c76b2a}
@media (prefers-color-scheme:dark){:root{--bg:#161719;--card:#202226;--ink:#ecebe8;--muted:#a19d95;--line:#33363b;--soft:#2a2d32;
--acc:#8db8e3;--acc-ink:#10151b;--accs:#26323f;--up:#7fcf9c;--ups:#1f3328;--down:#f0957f;--downs:#3d2620;--flat:#b3afa7;--flats:#2c2e31;--new:#e3c06e;--news:#3a3220;
--chart1:#8db8e3;--chart2:#eba068}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.7rem;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:.92rem}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.block{width:100%;padding:14px}
.btn.ghost{background:none;border:none;color:var(--acc);padding:8px 4px}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.45;cursor:default}
.fab{width:46px;height:46px;border-radius:50%;border:none;background:var(--acc);color:var(--acc-ink);font-size:1.6rem;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.92rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dash{border-style:dashed;background:none}
select.chip{width:auto;appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;color:var(--ink)}
select.chip.warnchip{border-color:var(--new);color:var(--new)}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font:600 .95rem ui-monospace,Menlo,monospace;flex:none}
.code{font:600 1.05rem ui-monospace,Menlo,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.b-besser{background:var(--ups);color:var(--up)}.b-schlechter{background:var(--downs);color:var(--down)}
.b-stabil,.b-gemischt{background:var(--flats);color:var(--flat)}.b-neu{background:var(--news);color:var(--new)}
.tag{display:inline-block;background:var(--accs);color:var(--acc);border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:600}
.hint{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.88rem;margin:4px 0 12px}
label{display:block;font-weight:600;margin:14px 0 6px}
.sub{font-weight:400;color:var(--muted);font-size:.86rem;margin:-2px 0 6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px;font-weight:600}
.toggle button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.tip{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.tip summary{cursor:pointer;color:var(--acc);font-weight:600}
.dentry{border-top:1px solid var(--line);padding:10px 0}.dentry:first-of-type{border-top:none}
.cat{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--muted)}
.cat.c-Notiz{background:var(--accs);color:var(--chart1)}.cat.c-Erfolg{background:var(--ups);color:var(--up)}.cat.c-Vorfall{background:var(--downs);color:var(--down)}.cat.c-Elternkontakt,.cat.c-Gespräch{background:var(--accs);color:var(--acc)}.cat.c-Absprache{background:var(--news);color:var(--new)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}.catpick button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:.88rem;font-weight:600}.catpick button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:160px;background:none;border:none;padding:9px 0 10px;color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px}
/* Bewerten */
.rate{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;overflow:auto}
.rate .inner{max-width:640px;width:100%;margin:0 auto;padding:12px 16px;flex:1;display:flex;flex-direction:column}
.progress{display:flex;gap:6px;margin:10px 0 12px}.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}.progress i.on{background:var(--acc)}
.goalTitle{font-size:1.65rem;font-weight:700;text-align:center;margin:22px 0 4px;line-height:1.2}
.big{font-size:3rem;font-weight:700;text-align:center;height:64px;margin-top:10px}
.track{position:relative;height:44px;border-radius:22px;background:var(--soft);margin:8px 0 6px;touch-action:none;cursor:pointer;outline:none}
.track:focus-visible{outline:2px solid var(--acc)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:22px;background:var(--accs)}
.track .dot{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--muted);opacity:.5}
.track .thumb{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.na{border:none;background:none;color:var(--acc);font-weight:600;padding:12px;margin:8px auto 0;display:flex;gap:6px;align-items:center}
.na.on{color:var(--new)}
.foot{margin-top:auto;padding-top:14px}
/* Analyse */
svg.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--acc)}
.sum p{margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--soft);border-radius:12px;padding:10px}.stat b{display:block;font-size:1.35rem}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20}
@media print{nav,.noprint{display:none!important}main{padding:0}}
.printonly{display:none}@media print{.printonly{display:block}}
/* === Gestaltung: warm & freundlich === */
:root{--bg:#fbf6ef;--card:#fffdf9;--ink:#2b2420;--muted:#80736a;--line:#efe4d6;--soft:#f5ece0;
--acc:#d0643c;--acc-ink:#fff;--accs:#fbe6dc;--up:#4c8a5a;--ups:#e4f1e3;--down:#c0483a;--downs:#f9e1dc;--flat:#80736a;--flats:#f1ebe3;--new:#a7790f;--news:#f8edcf;--chart1:#d0643c}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#27221e;--ink:#f3ece4;--muted:#b3a69b;--line:#3a332d;--soft:#322b26;
--acc:#f0936b;--acc-ink:#1d1916;--accs:#43291f;--up:#8ccb98;--ups:#20301f;--down:#f28d7f;--downs:#3b2320;--flat:#b3a69b;--flats:#302a25;--new:#e8c15f;--news:#382d16;--chart1:#f0936b}}
html,body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,sans-serif}
h1{font-size:1.9rem;font-weight:800}
.card{border-radius:24px;border:1.5px solid var(--line);padding:16px}
.btn{border-radius:999px;border-width:1.5px}
.btn.block{border-radius:18px}
.avatar{border-radius:16px;background:var(--accs);color:var(--acc);font-family:inherit;font-weight:800}
.code{font-family:inherit;font-weight:800;letter-spacing:.02em}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.badge{border-radius:10px}
.stat div{background:var(--card);border:1.5px solid var(--line);border-radius:20px}
.stat b{font-size:1.6rem;color:var(--acc)}

.goalTitle{font-size:1.75rem}
.big{font-size:3.4rem;color:var(--acc)}
.toggle button{border-radius:18px}
h1{display:flex;align-items:center;gap:10px}
h1::before{content:"";width:14px;height:14px;border-radius:5px;background:var(--acc);transform:rotate(45deg);flex:none}
.kcard{border-left:7px solid var(--kc)}
.kic{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--kc) 22%,var(--card));font-size:1.2rem;line-height:1}
.kic.big{width:52px;height:52px;font-size:1.8rem}.kic.add{color:var(--muted);font-weight:700;border:2px dashed var(--line);background:none}
.icbtn{border:none;background:none;padding:0}.icpick{border:2px solid var(--line);--kc:var(--acc)}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:50vh;overflow:auto}.icgrid button{font-size:1.6rem;padding:6px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.icgrid .used{opacity:.35}.icgrid .on{border:2px solid var(--acc);background:var(--accs)}
.kdot{width:14px;height:14px;border-radius:50%;background:var(--kc);display:inline-block;flex:none}
.trend{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.trend i{width:9px;height:9px;border-radius:50%;background:currentColor}
.t-besser{color:var(--up)}.t-schlechter{color:var(--down)}.t-neu{color:var(--new)}
.when{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;background:var(--soft);border-radius:18px;padding:10px}
.when .sub{margin:0 0 3px 4px;font-size:.78rem}
.when select{padding:8px 10px;border-radius:12px}
.when.past{outline:2px dashed var(--new)}
.step{text-align:center;color:var(--muted);font-weight:700;font-size:.88rem;margin:4px 0 10px}
.ruler{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;margin:10px 0 6px}
.ruler button{height:54px;border:none;border-radius:12px;background:var(--soft);font:inherit;font-weight:800;font-size:1.05rem;color:var(--muted);padding:0}
.ruler button.lit{background:var(--accs);color:var(--acc)}
.ruler button.sel{background:var(--acc);color:var(--acc-ink);transform:scale(1.1);box-shadow:0 4px 12px -4px var(--acc)}
.ruler.off{opacity:.35;pointer-events:none}
.duo{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.duo .btn{padding:14px 10px}
.btn.na-on{border-color:var(--new);color:var(--new)}


/* Motivation */
.ring{position:relative;width:86px;height:86px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem;line-height:1.05;text-align:center}
.ring b small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.streak{font-size:1.5rem;font-weight:800;color:var(--acc)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1.1)}}
.ruler button.sel{animation:pop .22s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.goalTitle.anim{animation:rise .28s ease-out}
.cele{position:fixed;inset:0;z-index:31;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 45%,transparent)}
.cele .box{background:var(--card);border-radius:28px;padding:26px 24px;text-align:center;max-width:320px;width:86%;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);animation:rise .3s ease-out}
.cele h2{margin:10px 0 4px;font-size:1.4rem}
.cele circle.c{stroke-dasharray:190;stroke-dashoffset:190;animation:draw .5s .05s ease-out forwards}
.cele path{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .35s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:3px;z-index:30;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.ruler button.sel,.goalTitle.anim,.cele .box,.cele circle.c,.cele path{animation:none;stroke-dashoffset:0}.conf{display:none}}

/* Gesprächsblatt */

.talk .tg h2{margin:0 0 4px;font-size:1.3rem}
.talk .sym{font-size:2.6rem;line-height:1}
.talk .msg{font-size:1.15rem;font-weight:800}
.talk .nums{display:flex;gap:10px;margin:10px 0}
.talk .nums div{flex:1;background:var(--soft);border-radius:16px;padding:8px 10px;text-align:center}
.talk .nums b{display:block;font-size:1.6rem}
.talk .line{border-bottom:1.5px solid var(--line);height:34px}
@media (min-width:900px){.talk .tgs{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}.talk .tgs.n1{grid-template-columns:1fr}.talk .tgs.n3{grid-template-columns:repeat(3,1fr)}.talk .tbot{display:grid;gap:14px;grid-template-columns:1fr 1fr}.talk .tgs .tg,.talk .tbot .tg{margin:0}.talk .tbot{margin-top:14px}}

 html,body,main,.talk{background:#fff!important;min-height:0!important;height:auto!important}
 body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11pt}main{padding:0!important;max-width:none!important}

 .talk .nums{margin:4px 0}.talk .nums div{padding:4px 8px}.talk .nums b{font-size:1.15rem}.talk .sym{font-size:1.5rem}.talk .msg{font-size:1rem}.talk .line{height:24px}

.rast .x{border:none;background:none;color:var(--muted);font-size:1rem;padding:6px}.pick.days5{grid-template-columns:1.6fr repeat(5,1fr)}
.swr{display:flex;align-items:center;gap:12px;margin:10px 0;font-weight:600;cursor:pointer}.swr .sub{display:block;font-weight:400;margin-top:2px}
input.sw{appearance:none;-webkit-appearance:none;width:50px!important;min-width:50px;height:30px;border-radius:15px;background:var(--line);border:none;position:relative;margin:0;padding:0;transition:background .15s;flex:none}

input.sw:checked{background:var(--acc)}input.sw:checked::after{left:23px}
.gopts{display:grid;gap:8px}.gopts button{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 13px;font:inherit}
.gopts button b{display:block}.gopts button span{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}.gopts button.on{border:2px solid var(--acc);background:var(--accs)}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0}.dots button{width:10px;height:10px;border-radius:50%;border:none;padding:0;background:var(--line)}.dots .on{background:var(--acc);width:24px;border-radius:5px}
.help ul{padding-left:20px;margin:10px 0 0}.help li{margin:8px 0}.help p{font-size:1.05rem}
.stepr{margin:12px 0 4px;gap:10px}.stepr button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;font-weight:700}.stepr button:disabled{opacity:.35}.stepr b{min-width:22px;text-align:center;font-size:1.2rem}
.mem{display:inline-flex;gap:6px;align-items:center;background:var(--accs);color:var(--ink);border-radius:999px;padding:6px 6px 6px 12px;font-weight:700}.mem .small{font-weight:400;color:var(--muted)}
.mem button{border:none;background:var(--card);color:var(--down);border-radius:999px;width:26px;height:26px;font-weight:800;cursor:pointer}
.ctx{background:var(--soft);border-radius:18px;padding:10px;display:grid;gap:8px}
.ctx.past{outline:2px dashed var(--new)}

.pick.days{grid-template-columns:1fr 1fr 1.2fr}.pick.slots{grid-template-columns:repeat(7,1fr)}.pick.subjs{grid-template-columns:repeat(4,1fr)}

.pick select{padding:8px 6px}
.pick .on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ctxline{width:100%;border:none;background:var(--soft);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;color:var(--ink);text-align:left}
.ctxline span{float:right;color:var(--acc)}

<script>
"use strict";
/* ===== Speicher ===== */
const KEY="verlaufsbogen-v2";
const OLD_SUBJECTS=["Deutsch","Mathe","Englisch","GL","NW","Sport","AL","Kunst","Musik","Religion/PP"];

function trend(g){
  const v=rated(g).map(e=>e.value);
  if(v.length<6)return {k:"neu",t:"noch zu wenig Daten",n:v.length};
  // Mit Förderbeginn: vorher vs. seitdem (je bis zu 5 Werte), sonst: letzte 5 vs. 5 davor
  const r=rated(g),pre=g.start?r.filter(e=>e.date<g.start).map(e=>e.value):[],post=g.start?r.filter(e=>e.date>=g.start).map(e=>e.value):[];
  const byStart=pre.length>=3&&post.length>=3;
  const mL=byStart?mean(post.slice(-5)):mean(v.slice(-5)),mP=byStart?mean(pre.slice(-5)):mean(v.slice(-10,-5)),d=(mL-mP)*(g.dir==="down"?-1:1);
  const k=d>=1?"besser":d<=-1?"schlechter":"stabil";
  return {k,t:{besser:"läuft besser",schlechter:"wird schwieriger",stabil:"gleichbleibend"}[k],mL,mP,byStart};
}
function kidTrend(k){
  const t=k.goals.map(trend).filter(x=>x.k!=="neu").map(x=>x.k);
  if(!t.length)return {k:"neu",t:k.goals.length?"noch zu wenig Daten":"ohne Ziel"};
  if(t.includes("besser")&&t.includes("schlechter"))return {k:"gemischt",t:"unterschiedlich"};
  if(t.includes("besser"))return {k:"besser",t:"läuft besser"};
  if(t.includes("schlechter"))return {k:"schlechter",t:"wird schwieriger"};
  return {k:"stabil",t:"gleichbleibend"};
}

/* ===== Motivation: ein Wochenziel, sonst nichts ===== */
const G=()=>{const g=db.game??={};g.on??=true;g.sound??=false;g.type??="kids";g.n??=2;return g};
const own=()=>db.kids.flatMap(k=>k.goals.flatMap(g=>g.entries)).filter(e=>!e.gen);
const dayOf=ts=>iso(new Date(ts));
function weekStart(d=today()){while(new Date(d+"T12:00").getDay()!==1)d=addDays(d,-1);return d}
const GOALTYPES={
 kids:{t:"Jedes Kind regelmäßig im Blick",d:n=>`Jedes Kind mindestens ${n}× pro Woche einschätzen`,def:2},
 days:{t:"Feste Gewohnheit",d:n=>`An mindestens ${n} Schultagen pro Woche einschätzen`,def:3},
 good:{t:"Auf das Gelingen schauen",d:()=>"Für jedes Kind einen Erfolg pro Woche ins Tagebuch",def:1}};
function weekProgress(w=weekStart()){
  const end=addDays(w,7),g=G(),inW=ts=>{const d=dayOf(ts);return d>=w&&d<end};
  const kids=db.kids.filter(k=>!k.demo&&k.goals.some(x=>x.entries.some(e=>!e.gen&&dayOf(e.ts)<end)));
  const any=kids.some(k=>k.goals.some(x=>x.entries.some(e=>!e.gen&&inW(e.ts)))||(k.diary||[]).some(e=>!e.gen&&inW(e.ts)));
  if(g.type==="days"){const ds=new Set(own().filter(e=>inW(e.ts)).map(e=>dayOf(e.ts)));return {have:ds.size,need:g.n,any,unit:"Tage"}}
  const ok=k=>g.type==="good"?(k.diary||[]).some(e=>!e.gen&&e.cat==="Erfolg"&&inW(e.ts)):k.goals.flatMap(x=>x.entries).filter(e=>!e.gen&&inW(e.ts)).length>=g.n;
  return {have:kids.filter(ok).length,need:kids.length,any,unit:"Kinder"}}
const weekDone=p=>p.need>0&&p.have>=p.need;
function weeksInRow(){let w=weekStart(),n=weekDone(weekProgress(w))?1:0;
  for(let i=0;i<60;i++){w=addDays(w,-7);const p=weekProgress(w);if(!p.any)continue;if(!weekDone(p))break;n++}return n}
function motivationV(){
  if(!G().on)return "";
  const p=weekProgress(),done=weekDone(p),pct=p.need?Math.min(1,p.have/p.need):0,row=weeksInRow(),C=2*Math.PI*36;
  if(!p.need)return "";
  return `<div class="card"><div class="row" style="gap:16px">
  <div class="ring"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="43" cy="43" r="36" fill="none" stroke="var(--${done?"up":"acc"})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .6s"/></svg><b><span>${done?"✓":p.have}<small>${done?"geschafft":"von "+p.need}</small></span></b></div>
  <div class="grow"><div class="muted small">Wochenziel</div><div style="font-weight:700">${GOALTYPES[G().type].d(G().n)}</div>
  ${row>1?`<div class="muted small" style="margin-top:6px"><span class="streak">${row}</span> Wochen in Folge</div>`:""}</div></div></div>`;
}
function fb(kind){
  try{navigator.vibrate?.(kind==="big"?[12,60,18]:8)}catch(e){}
  if(!G().sound)return;
  try{const A=fb.ctx??=new (window.AudioContext||window.webkitAudioContext)();const now=A.currentTime;
    (kind==="big"?[660,880,1320]:[880]).forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,now+i*.09);g.gain.linearRampToValueAtTime(.08,now+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.25);o.connect(g).connect(A.destination);o.start(now+i*.09);o.stop(now+i*.09+.3)})}catch(e){}
}
function celebrate(k,n){
  const msg=`${n} Einschätzung${n===1?"":"en"} für ${esc(k.code)} gespeichert`;
  if(!G().on){fb("small");toast(msg);return}
  const p=weekProgress(),now=weekDone(p),first=now&&G().doneWeek!==weekStart();
  if(now)G().doneWeek=weekStart();save();fb(first?"big":"small");
  if(first){const cols=["var(--acc)","var(--up)","var(--new)","var(--chart1)","var(--down)"];
    for(let i=0;i<22;i++){const c=document.createElement("i");c.className="conf";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%5];c.style.animationDuration=(1.1+Math.random()*.9)+"s";c.style.animationDelay=Math.random()*.25+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}

  el.innerHTML=`<div class="box"><svg width="72" height="72" viewBox="0 0 72 72"><circle class="c" cx="36" cy="36" r="30" fill="none" stroke="var(--up)" stroke-width="6"/><path d="M23 37l9 9 17-19" fill="none" stroke="var(--up)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h2>${first?"Wochenziel geschafft!":"Gespeichert"}</h2><p class="muted">${msg}.</p>
  ${p.need?`<p style="font-weight:700">${first?"Stark, das ist echte Routine.":now?"Wochenziel schon erreicht.":`Wochenziel: ${p.have} von ${p.need} ${p.unit}`}</p>`:""}

}

  if(!kids.length)return h+`<div class="card"><p>Noch keine Kinder mit beobachtetem Verhalten.</p><p class="muted">Lege unter „Kinder“ ein Kind mit Kürzel an oder lade unter „Einstellungen“ den fiktiven Beispielfall.</p><p class="row" style="flex-wrap:wrap"><button class="btn pri" onclick="go({tab:'klassen'})">Zu den Kindern</button><button class="btn" onclick="openHelp()">Anleitung ansehen</button></p></div>`;

  }
  return h+`<p class="muted small">Tipp: Direkt nach der Stunde bewerten. Das dauert pro Ziel nur wenige Sekunden.</p>`;
}

/* ===== Klassen ===== */
function klassenV(){
  const f=view.filter??"alle";
  const count=c=>db.kids.filter(k=>c==="alle"||(c===""?!k.cls:k.cls===c)).length;
  const list=db.kids.filter(k=>f==="alle"||(f===""?!k.cls:k.cls===f)).sort((a,b)=>a.code.localeCompare(b.code));
  let h=`<h1>Kinder</h1>
  <div class="row" style="margin-bottom:12px"><select style="flex:1" onchange="view.filter=this.value;render()"><option value="alle" ${f==="alle"?"selected":""}>Alle Klassen (${count("alle")})</option>
  ${db.classes.map(c=>`<option value="${esc(c)}" ${f===c?"selected":""}>Klasse ${esc(c)} (${count(c)})</option>`).join("")}
  ${count("")?`<option value="" ${f===""?"selected":""}>ohne Klasse (${count("")})</option>`:""}</select>
  <button class="btn noprint" onclick="addClass()">Neue Klasse</button></div>`;
  if(view.adding)h+=`<div class="card"><div style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center"><label style="margin-top:0">Symbol</label><label style="margin-top:0">Kürzel</label><button id="nicon" class="kic big icpick" data-i="${view.newIcon||(view.newIcon=freeIcon())}" onclick="newKidIcon()" aria-label="Symbol ändern">${view.newIcon}</button><div><input id="ncode" value="${f&&f!=="alle"?newCode(f):""}" placeholder="z. B. 8A-01" oninput="this.dataset.auto='';$('#nw').hidden=!looksLikeName(this.value)" data-auto="1"></div></div>
  <div class="sub" style="margin-top:4px">Symbol zum schnellen Wiedererkennen, zufällig gewählt. Kürzel: Klasse und laufende Nummer, keine Namen oder Initialen. Die Zuordnung steht nur in der Förderakte.</div>
  <p id="nw" class="small" style="color:var(--down)" hidden>Das sieht nach einem Namen aus. Bitte ein Kürzel verwenden.</p>
  <label>Klasse</label><select id="ncls" onchange="const i=$('#ncode');if(this.value&&(i.dataset.auto||!i.value)){i.value=newCode(this.value);i.dataset.auto='1'}"><option value="">Ohne Klasse</option>${db.classes.map(c=>`<option ${c===f?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <p style="margin-top:12px" class="row"><button class="btn pri" onclick="addKid()">Anlegen</button><button class="btn ghost" onclick="view.adding=false;render()">Abbrechen</button></p></div>`;
  if(!list.length&&!view.adding)h+=`<p class="muted">Hier ist noch niemand. Lege unten ein Kind mit Kürzel an.</p>`;
  for(const k of list)h+=`<div class="card tap row kcard" style="--kc:${kidColor(k)}" onclick="go({tab:'klassen',kid:'${k.id}'})">${kidIcon(k)}
  <div class="grow"><div class="code">${esc(k.code)} ${k.demo?'<span class="tag">fiktiv</span>':""}</div><div class="muted small">${k.cls?esc(k.cls)+" · ":""}${k.goals.length} ${k.goals.length===1?"Verhalten":"Verhalten"}</div></div>${badge(kidTrend(k))}</div>`;
  if(!view.adding)h+=`<p style="margin-top:14px"><button class="btn block noprint" onclick="view.adding=true;render();$('#ncode').focus()">+ Kind anlegen</button></p>`;
  h+=`<p class="muted small" style="text-align:center">Nur Kürzel verwenden, keine Namen.</p>`;
  return h;
}
async function addClass(){const c=((await askText("Name der neuen Klasse","z. B. 7B"))||"").trim();if(!c)return;if(!db.classes.includes(c))db.classes.push(c);db.classes.sort();save();view.filter=c;render()}
function newCode(cls){let n=1,c;do{c=`${cls}-${String(n++).padStart(2,"0")}`}while(db.kids.some(k=>k.code.toLowerCase()===c.toLowerCase()));return c}
async function addKid(){const code=$("#ncode").value.trim();if(!code)return toast("Bitte ein Kürzel eingeben.");
  if(looksLikeName(code)&&!await ask("Das Kürzel sieht nach einem Namen aus. Trotzdem speichern?",{ok:"Trotzdem speichern"}))return;
  const k={id:uid(),code,icon:$("#nicon").dataset.i,cls:$("#ncls").value,goals:[],diary:[],ts:Date.now()};delete view.newIcon;db.kids.push(k);save();go({tab:"klassen",kid:k.id})}

/* ===== Kind ===== */
function spark(g){
  const v=rated(g).slice(-12).map(e=>e.value);if(v.length<2)return "";
  const W=90,H=28,x=i=>i*(W-4)/(v.length-1)+2,y=val=>H-2-val/10*(H-4);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" points="${v.map((a,i)=>x(i)+","+y(a)).join(" ")}"/></svg>`;
}
function kidV(){
  const k=kidById(view.kid);if(!k){view={tab:"klassen"};return klassenV()}
  let h=`<button class="btn ghost noprint" onclick="go({tab:'${view.tab}'})">‹ Zurück</button>
  <div class="row" style="margin:6px 0 4px"><button class="icbtn" aria-label="Symbol ändern" onclick="setKidIcon('${k.id}')">${k.icon?kidIcon(k,1):`<span class="kic big add" style="--kc:${kidColor(k)}">+</span>`}</button><div class="grow"><div class="code" style="font-size:1.4rem">${esc(k.code)}</div>
  <select class="chip" style="margin-top:4px;width:auto" onchange="Object.assign(kidById('${k.id}'),{cls:this.value,upd:Date.now()});save();render()"><option value="">Ohne Klasse</option>${db.classes.map(c=>`<option ${c===k.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>${badge(kidTrend(k))}</div>
  ${k.goals.length?`<div class="duo" style="margin:14px 0;grid-template-columns:1fr 1fr"><button class="btn pri" onclick="startRate('${k.id}')">Jetzt bewerten</button><button class="btn" onclick="go({tab:'${view.tab}',kid:'${k.id}',talk:true})">Gesprächsblatt</button></div>`:""}
  <h2>Verhalten</h2>`;
  if(!k.goals.length)h+=`<p class="muted">Noch kein Verhalten angelegt. Übernimm am besten ein Förderziel aus dem Förderplan.</p>`;
  for(const g of k.goals){const t=trend(g),n=rated(g).length;
    h+=`<div class="card"><div class="between"><div class="grow"><b>${esc(g.title)}</b><div class="muted small">${g.dir==="down"?"weniger davon":"mehr davon"} · ${n} Einschätzung${n===1?"":"en"}</div></div>${spark(g)}</div>
    <div class="between" style="margin-top:8px">${badge(t)}<span><button class="btn ghost" onclick="go({tab:'analyse',aKid:'${k.id}',aGoal:'${g.id}'})">Verlauf</button><button class="btn ghost" onclick="go({tab:'${view.tab}',kid:'${k.id}',goal:'${g.id}'})">Bearbeiten</button></span></div></div>`}
  h+=`<p><button class="btn block" onclick="go({tab:'${view.tab}',kid:'${k.id}',goal:''})">+ Verhalten</button></p>`+diaryV(k)+`
  <div class="card noprint row"><div class="grow small"><b>Mit Kolleg:in teilen</b><br><span class="muted">Verschlüsselte Datei nur mit diesem Kind.</span></div><button class="btn" onclick="shareKids('${k.id}')">Teilen</button></div>
  ${srvKidCard(k)}
  <p class="noprint" style="margin-top:24px"><button class="btn ghost danger" onclick="delKid('${k.id}')">Kind und alle Einschätzungen löschen</button></p>`;
  return h;
}
async function delKid(id){if(!await ask(`Kind mit allen Zielen, Einschätzungen und Tagebucheinträgen von diesem Gerät löschen? ${kidById(id)?.srv?"Auf dem Schulserver bleibt es für die anderen erhalten.":""}`,{ok:"Löschen",danger:true}))return;db.kids=db.kids.filter(k=>k.id!==id);save();go({tab:"klassen"})}

/* ===== Verhalten bearbeiten ===== */
let draft=null;
function goalEditV(){
  const k=kidById(view.kid);
  if(!draft||draft._for!==view.goal+k.id){const g=view.goal?goalById(k,view.goal):null;
    draft=g?{...g,locked:g.entries.length>0}:{title:"",fp:"",how:"",dir:"down",a0:"nie",a10:"ständig",target:"",start:"",scale:"10"};draft._for=view.goal+k.id}
  const d=draft;
  return `<div class="between"><button class="btn ghost" aria-label="Abbrechen" style="font-size:1.3rem" onclick="draft=null;go({tab:'${view.tab}',kid:'${k.id}'})">✕</button><b>${view.goal?"Verhalten bearbeiten":"Neues Verhalten"}</b><span style="width:30px"></span></div>
  <label>Verhalten</label><div class="sub">Kurz, so wie es beim Bewerten oben stehen soll.</div>
  <input id="ft" value="${esc(d.title)}" placeholder="z. B. Stört den Unterricht" oninput="draft.title=this.value">
  <label>Woran erkennst du es?</label><div class="sub">Damit alle, die bewerten, dasselbe meinen.</div>
  <textarea id="fh" placeholder="z. B. Ruft rein, verlässt den Platz ohne Erlaubnis, lenkt Mitschüler:innen ab." oninput="draft.how=this.value">${esc(d.how)}</textarea>
  <details class="tip" style="margin-top:8px"><summary>So wird das Verhalten gut beobachtbar</summary>
  <p>Beschreibe, was man sehen oder hören kann. Nicht „ist unkonzentriert“, sondern „arbeitet 10 Minuten am Platz, ohne aufzustehen“.</p>
  <p>Lieber zwei kleine Verhaltensweisen als eine große.</p></details>
  <label>Was soll sich ändern?</label>
  <div class="toggle"><button class="${d.dir==="down"?"on":""}" onclick="setDir('down')">Weniger davon</button><button class="${d.dir==="up"?"on":""}" onclick="setDir('up')">Mehr davon</button></div>
  <label>Skala</label>${d.locked?`<input value="${SCALES[sc(d)]}" disabled><div class="sub" style="margin-top:6px">Die Skala ist fest, weil es schon Einschätzungen gibt. So bleibt alles vergleichbar.</div>`
   :`<div class="toggle" style="grid-template-columns:1fr 1fr 1fr">${Object.entries(SCALES).map(([key,t])=>`<button class="${sc(d)===key?"on":""}" onclick="setScale('${key}')">${t.replace(/ \(.*\)/,"")}<br><span class="small" style="font-weight:400">${key==="10"?"0 bis 10":key==="5"?"1 bis 5":"zwei Knöpfe"}</span></button>`).join("")}</div>`}
  <label>${sc(d)==="2"?"Beschriftung der Knöpfe":`Was bedeuten ${sc(d)==="5"?"1 und 5":"0 und 10"}?`}</label>
  <div class="two"><div><div class="sub">${sc(d)==="2"?"Knopf „nicht gezeigt“":sc(d)==="5"?"1 heißt …":"0 heißt …"}</div><input value="${esc(d.a0)}" oninput="draft.a0=this.value"></div><div><div class="sub">${sc(d)==="2"?"Knopf „gezeigt“":sc(d)==="5"?"5 heißt …":"10 heißt …"}</div><input value="${esc(d.a10)}" oninput="draft.a10=this.value"></div></div>
  <label>Bezug zum Förderplan <span class="sub">(optional)</span></label>
  <textarea placeholder="Förderziel aus dem Förderplan einfügen" oninput="draft.fp=this.value">${esc(d.fp)}</textarea>
  <div class="two"><div><label>Ziel ist erreicht bei <span class="sub">(optional${sc(d)==="2"?", in % der Stunden":""})</span></label><input type="number" min="0" max="${sc(d)==="2"?100:sc(d)==="5"?5:10}" inputmode="numeric" value="${esc(d.tIn??(d.target===""?"":tgt(d).replace(" %","")))}" placeholder="${sc(d)==="2"?(d.dir==="down"?"z. B. höchstens 20":"z. B. mindestens 80"):sc(d)==="5"?(d.dir==="down"?"z. B. höchstens 2":"z. B. mindestens 4"):(d.dir==="down"?"z. B. höchstens 3":"z. B. mindestens 7")}" oninput="draft.tIn=this.value"></div>
  <div><label>Förderung startet am <span class="sub">(optional)</span></label><input type="date" value="${esc(d.start)}" oninput="draft.start=this.value"></div></div>
  <p style="margin-top:18px"><button class="btn pri block" onclick="saveGoal()">Speichern</button></p>
  ${view.goal?`<p><button class="btn ghost danger" onclick="delGoal()">Verhalten löschen</button></p>`:""}`;
}
function setScale(x){const d=draft,was=sc(d);d.scale=x;d.tIn=undefined;d.target="";
  if(x==="2"&&was!=="2"){d._a=[d.a0,d.a10];d.a0="nicht gezeigt";d.a10="gezeigt"}else if(was==="2"&&x!=="2"&&d._a){[d.a0,d.a10]=d._a}render()}
function setDir(x){draft.dir=x;if(x==="up"&&draft.a0==="nie"&&draft.a10==="ständig"){draft.a0="gar nicht";draft.a10="durchgehend"} if(x==="down"&&draft.a0==="gar nicht"&&draft.a10==="durchgehend"){draft.a0="nie";draft.a10="ständig"} render()}
function saveGoal(){const k=kidById(view.kid),d=draft;if(!d.title.trim())return toast("Bitte das Verhalten benennen.");
  const x=sc(d),raw=d.tIn===undefined?(d.target===""?"":null):d.tIn;let t;
  if(raw===null)t=d.target;else if(raw===""||raw==null)t="";else{const r=+raw;t=x==="5"?(Math.max(1,Math.min(5,Math.round(r)))-1)*2.5:x==="2"?Math.max(0,Math.min(100,r))/10:Math.max(0,Math.min(10,Math.round(r)))}
  const data={title:d.title.trim(),how:d.how.trim(),fp:d.fp.trim(),dir:d.dir,a0:d.a0.trim()||"0",a10:d.a10.trim()||"10",target:t,start:d.start||"",scale:x};
  data.upd=Date.now();if(view.goal)Object.assign(goalById(k,view.goal),data);else k.goals.push({id:uid(),...data,entries:[]});
  save();draft=null;toast("Gespeichert");go({tab:view.tab,kid:k.id})}
async function delGoal(){if(!await ask("Verhalten mit allen Einschätzungen löschen?",{ok:"Löschen",danger:true}))return;const k=kidById(view.kid);k.goals=k.goals.filter(g=>g.id!==view.goal);tomb(k,view.goal);save();draft=null;go({tab:view.tab,kid:k.id})}

/* ===== Bewerten ===== */
let rs=null;
const slotName=r=>r[0].replace(/\.$/,"")+". Std.";
const SLOTS_ALL=()=>[...db.raster.map(slotName),"Pause"];
const hm=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const rTime=(r,wd)=>{const d=r[3]?.[wd];return [d?.[0]||r[1],d?.[1]||r[2]]};
function currentSlot(){const n=new Date(),wd=n.getDay(),m=n.getHours()*60+n.getMinutes();if(wd===0||wd===6)return "";
  let best="";for(const r of db.raster){const [a,b]=rTime(r,wd),st=hm(a),en=hm(b);if(m>=st-5){best=m>en+90?"":slotName(r)}}return best}
function startRate(kidId){const k=kidById(kidId);if(!k.goals.length)return;
  const cs=currentSlot(),same=lastCtx&&lastCtx.slot===cs&&lastCtx.day===today()&&Date.now()-lastCtx.ts<75*6e4;
  rs={kid:kidId,i:0,date:today(),slot:cs,subj:same?lastCtx.subj:"",cur:{value:null,na:false,note:"",pin:false},count:0,ctxOpen:true};renderRate()}
function renderRate(){
  const o=$("#overlay");if(!rs){o.innerHTML="";return}
  const k=kidById(rs.kid),g=k.goals[rs.i],c=rs.cur,t=today();
  const days=[...Array(7)].map((_,i)=>addDays(t,-i));
  const dayLbl=d=>d===t?"Heute":d===addDays(t,-1)?"Gestern":new Date(d+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"});
  o.innerHTML=`<div class="rate" role="dialog" aria-label="Bewerten"><div class="inner">
  <div class="between"><button class="btn ghost" style="font-size:1.3rem" aria-label="Schließen" onclick="closeRate()">✕</button><div class="row">${kidIcon(k)}<span class="code">${esc(k.code)}</span></div><span style="width:40px"></span></div>
  <div class="step">${k.goals.length>1?`Verhalten ${rs.i+1} von ${k.goals.length}`:"&nbsp;"}</div>
  ${rs.ctxOpen?`<div class="ctx ${rs.date!==t?"past":""}">
   <div class="pick days">${days.slice(0,2).map(d=>`<button class="${d===rs.date?"on":""}" onclick="rs.date='${d}';renderRate()">${dayLbl(d)}</button>`).join("")}<select class="${days.slice(2).includes(rs.date)?"on":""}" onchange="rs.date=this.value;renderRate()"><option value="">früher …</option>${days.slice(2).map(d=>`<option value="${d}" ${d===rs.date?"selected":""}>${dayLbl(d)}</option>`).join("")}</select></div>
   <div class="pick slots">${SLOTS_ALL().map(x=>`<button class="${x===rs.slot?"on":""}" onclick="rs.slot=rs.slot==='${x}'?'':'${x}';renderRate()">${x.replace(" Std.","")}</button>`).join("")}</div>
   <div class="pick subjs">${db.subjects.map(x=>`<button class="${x===rs.subj?"on":""}" onclick="rs.subj=rs.subj===this.textContent?'':this.textContent;renderRate()">${esc(x)}</button>`).join("")}</div></div>`
  :`<button class="ctxline" onclick="rs.ctxOpen=true;renderRate()">${dayLbl(rs.date)} · ${rs.slot||"ohne Stunde"} · ${esc(rs.subj||"ohne Fach")} <span>ändern</span></button>`}
  ${rs.date!==t?`<p class="small" style="text-align:center;color:var(--new)">Eintrag für einen vergangenen Tag (${dDEy(rs.date)})</p>`:""}
  <div class="goalTitle">${esc(g.title)}</div>
  ${g.how?`<p class="muted small" style="text-align:center">${esc(g.how)}</p>`:""}
  <div class="big" id="big">${c.na?'<span class="muted" style="font-size:1.1rem">Nicht beobachtet</span>':c.value==null?`<span class="muted" style="font-size:1.05rem;font-weight:400">${sc(g)==="2"?"Wurde das Verhalten gezeigt?":"Wie stark war es? Tippe eine Zahl an."}</span>`:esc(dv(g,c.value))}</div>
  <div class="ruler s${sc(g)} ${c.na?"off":""}" id="ruler" role="radiogroup" aria-label="Einschätzung">${scaleOpts(g).map(o=>`<button data-v="${o.v}" role="radio" aria-checked="${c.value===o.v}" class="${c.value===o.v?"sel":sc(g)!=="2"&&c.value!=null&&o.v<c.value?"lit":""}">${esc(o.l)}</button>`).join("")}</div>
  ${sc(g)==="2"?"":`<div class="ends"><span>${sc(g)==="5"?1:0} = ${esc(g.a0)}</span><span>${esc(g.a10)} = ${sc(g)==="5"?5:10}</span></div>`}

function weekBars(g,from){

function barSvg(g,wk){
  const W=340,H=170,T=22,B=26,n=wk.length,bw=Math.min(46,(W-20)/n-10),gap=(W-n*bw)/(n+1),Y=v=>T+(1-v/10)*(H-T-B);

  s+=`<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="2"/>`;
  wk.forEach((x,i)=>{const X=gap+i*(bw+gap),y=Y(x.v);
    s+=`<rect x="${X}" y="${y}" width="${bw}" height="${Y(0)-y}" rx="10" fill="${meets(x.v)?"var(--up)":"var(--acc)"}" opacity="${i===n-1?1:.55}"/>

    <text x="${X+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${i===n-1?"jetzt":dDE(x.w)}</text>`});

}

const CATCOL={Notiz:"--chart1",Erfolg:"--up",Vorfall:"--down",Gespräch:"--acc",Elternkontakt:"--acc",Absprache:"--new",Beobachtung:"--muted"};
function chart(g,k){

  [0,5,10].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${sc(g)==="2"?(v===10?"ja":v===0?"nein":""):sc(g)==="5"?v/2.5+1:v}</text>`);
  if(g.target!==""){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(g.target)}" y2="${Y(g.target)}" stroke="var(--up)" stroke-dasharray="3 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(g.target)-5}" font-size="11" text-anchor="end" fill="var(--up)">Ziel</text>`}
  if(g.start){const i=e.findIndex(x=>x.date>=g.start);if(i>0){const xs=(X(i-1)+X(i))/2;s+=`<line x1="${xs}" x2="${xs}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${xs+5}" y="${T+10}" font-size="11" fill="var(--muted)">Förderung</text>`}}
  const pts=e.map((x,i)=>x.value==null?null:[X(i),Y(x.value)]);
  s+=`<polyline fill="none" stroke="var(--chart1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.filter(Boolean).map(p=>p.join(",")).join(" ")}"/>`;
  e.forEach((x,i)=>{if(x.value==null)s+=`<circle cx="${X(i)}" cy="${H-B}" r="4" fill="none" stroke="var(--muted)"><title>${dDE(x.date)}: nicht beobachtet</title></circle>`;
    else s+=`<circle cx="${X(i)}" cy="${Y(x.value)}" r="4.5" fill="var(--chart1)" stroke="var(--card)" stroke-width="1.5"><title>${dDE(x.date)} ${esc(x.subj)}: ${esc(dv(g,x.value))}</title></circle>`});
  // Tagebucheinträge im Zeitraum als nummerierte Markierungen
  const xDate=d=>{const i=e.findIndex(x=>x.date>=d);if(i<0)return d===e[e.length-1].date?X(e.length-1):null;if(e[i].date===d)return X(i);return i===0?null:(X(i-1)+X(i))/2};

  marks.forEach((m,n)=>{const col=`var(${CATCOL[m.d.cat]||"--muted"})`,key=Math.round(m.x),off=(used[key]=(used[key]||0)+1)-1,cx=Math.min(W-9,Math.max(L+9,m.x+off*15));
    s+=`<line x1="${m.x}" x2="${m.x}" y1="${T-4}" y2="${H-B}" stroke="${col}" stroke-width="1" opacity=".45"/>
    <g style="cursor:pointer" onclick="const el=document.getElementById('dn${n+1}');el.scrollIntoView({block:'center'});el.animate([{background:'var(--accs)'},{background:'transparent'}],1200)"><circle cx="${cx}" cy="${T-14}" r="8" fill="${col}"/><text x="${cx}" y="${T-10.5}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--card)">${n+1}</text><title>${dDE(m.d.date)} ${esc(m.d.cat)}: ${esc(m.d.text)}</title></g>`});
  chart.marks=marks;
  const step=Math.max(1,Math.ceil(e.length/6));
  e.forEach((x,i)=>{if(i%step===0||i===e.length-1)s+=`<text x="${X(i)}" y="${H-7}" font-size="11" text-anchor="${i===e.length-1?"end":i===0?"start":"middle"}" fill="var(--muted)">${dDE(x.date)}</text>`});

}
function groupTable(g,key,label){
  const m={};rated(g).forEach(e=>{const k=e[key]||"";if(!k)return;(m[k]??=[]).push(e.value)});
  const rows=Object.entries(m).filter(([,v])=>v.length>=2).map(([k,v])=>[k,mean(v),v.length]);
  if(rows.length<2)return {html:"",best:null,worst:null};
  rows.sort((a,b)=>g.dir==="down"?a[1]-b[1]:b[1]-a[1]);
  return {best:rows[0],worst:rows[rows.length-1],html:`<table><tr><th>${label}</th><th>Ø</th><th style="width:40%"></th><th>n</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${fm(g,r[1])}</td><td><div class="bar" style="width:${r[1]*10}%"></div></td><td class="muted">${r[2]}</td></tr>`).join("")}</table>`};
}
function summary(k,g){
  const r=rated(g),all=g.entries,na=all.filter(e=>e.value==null).length,t=trend(g),out=[];
  if(!r.length)return {lines:["Noch keine Einschätzungen."],text:""};
  const first=sortE(all)[0].date,last=sortE(all).slice(-1)[0].date;
  out.push(`${r.length} Einschätzung${r.length===1?"":"en"} vom ${dDEy(first)} bis ${dDEy(last)}${na?`, dazu ${na}-mal nicht beobachtet`:""}.`);

  else out.push(`${t.byStart?`Die letzten 5 Einschätzungen vor Förderbeginn (${dDEy(g.start)}) lagen im Schnitt bei ${fm(g,t.mP)}, die letzten 5 seitdem bei ${fm(g,t.mL)}.`:`Die letzten 5 Einschätzungen liegen im Schnitt bei ${fm(g,t.mL)}, die 5 davor bei ${fm(g,t.mP)}.`} <b>${t.k==="besser"?"Das Verhalten entwickelt sich eher in die gewünschte Richtung.":t.k==="schlechter"?"Das Verhalten entwickelt sich eher in die falsche Richtung.":"Das Verhalten ist ungefähr gleich geblieben."}</b>`);
  if(g.target!==""){const l5=r.slice(-5),hit=l5.filter(e=>g.dir==="down"?e.value<=g.target:e.value>=g.target).length;
    out.push(`Ziel (${g.dir==="down"?"höchstens":"mindestens"} ${tgt(g)}): in ${hit} der letzten ${l5.length} Einschätzungen erreicht.${hit>=4&&l5.length>=5?" <b>Das Ziel kann als erreicht gelten.</b>":""}`)}
  const bs=groupTable(g,"subj","Fach"),bt=groupTable(g,"slot","Stunde");

/* ===== Datenmodell für Austausch: Änderungszeiten, Löschmarken, Zusammenführen =====
   Jeder Eintrag hat eine feste id und eine Änderungszeit (ts/edited/upd). Gelöschte ids stehen in k.del.
   Zusammengeführt wird pro Kind: Neues kommt dazu, bei gleicher id gewinnt die neuere Fassung.
   Dieselbe Regel nutzt der Schulserver (server/pfad-server.mjs). */
const tomb=(k,id)=>{(k.del??=[]).includes(id)||k.del.push(id);k.delTs=Date.now()};
const ver=x=>x.edited||x.upd||x.ts||0;
function kidVer(k){return Math.max(ver(k),...k.goals.map(ver),...k.goals.flatMap(g=>g.entries.map(ver)),...(k.diary||[]).map(ver),k.delTs||0)}
function mergeList(a=[],b=[],del){const m=new Map(a.map(x=>[x.id,x]));for(const x of b){const y=m.get(x.id);if(!y||ver(x)>ver(y))m.set(x.id,x)}return [...m.values()].filter(x=>!del.has(x.id))}
function mergeKid(k){const ex=kidById(k.id);
  if(!ex){db.kids.push(k);if(k.cls&&!db.classes.includes(k.cls))db.classes.push(k.cls);return 1}
  const del=new Set([...(ex.del||[]),...(k.del||[])]),before=JSON.stringify(ex);
  if(ver(k)>ver(ex))Object.assign(ex,{code:k.code,cls:k.cls,upd:k.upd,...(k.icon?{icon:k.icon}:{})});
  if(k.team)ex.team=k.team;if(k.pending)ex.pending=k.pending;
  const eg=new Map(ex.goals.map(g=>[g.id,g]));
  ex.goals=mergeList(ex.goals,k.goals,del).map(g=>{const a=eg.get(g.id)?.entries||[],b=(k.goals.find(x=>x.id===g.id)||{}).entries||[];return {...g,entries:mergeList(a,b,del)}});
  ex.diary=mergeList(ex.diary,k.diary,del);ex.del=[...del];ex.delTs=Math.max(ex.delTs||0,k.delTs||0);if(ex.cls&&!db.classes.includes(ex.cls))db.classes.push(ex.cls);

function diffKid(k){const ex=kidById(k.id);
  const cnt=x=>({goals:x.goals.length,entries:x.goals.reduce((s,g)=>s+g.entries.length,0),diary:(x.diary||[]).length});
  if(!ex)return {neu:true,...cnt(k)};
  const ids=new Map([...ex.goals,...ex.goals.flatMap(g=>g.entries),...(ex.diary||[])].map(x=>[x.id,ver(x)])),del=new Set(ex.del||[]);

  for(const g of k.goals){if(del.has(g.id))continue;if(!ids.has(g.id))goals++;else if(ver(g)>ids.get(g.id))changed++;
    for(const e of g.entries){if(del.has(e.id))continue;if(!ids.has(e.id))entries++;else if(ver(e)>ids.get(e.id))changed++}}
  for(const e of k.diary||[]){if(del.has(e.id))continue;if(!ids.has(e.id))diary++;else if(ver(e)>ids.get(e.id))changed++}
  const dels=(k.del||[]).filter(id=>ids.has(id)).length;
  return {neu:false,goals,entries,diary,changed,dels,leer:!(goals+entries+diary+changed+dels)}}

async function pwKey(pw,salt){const base=await crypto.subtle.importKey("raw",enc(pw),"PBKDF2",false,["deriveKey"]);

    <p class="muted small">Abgeglichen werden nur Kinder, die du beim Kind freigegeben hast. Alles andere bleibt nur auf diesem Gerät.</p></div>`;
  return `<details class="card"><summary style="font-weight:800;font-size:1.1rem">Schulserver <span class="muted small" style="font-weight:400">(in Vorbereitung)</span></summary>
    <p class="muted small">Sobald ein Pfad-Server im Schulnetz läuft, trägst du hier Adresse, Kürzel und Passwort ein. Dann gleicht die App im Schul-WLAN automatisch ab.</p>
    <label>Adresse</label><input id="srvUrl" placeholder="z. B. https://pfad.schule.local" value="${esc(s.url||"")}">
    <div class="two"><div><label>Kürzel</label><input id="srvMe" value="${esc(db.me||"")}"></div><div><label>Passwort</label><input id="srvPw" type="password"></div></div>
    <p><button class="btn" onclick="srvConnect()">Verbinden</button></p></details>`}
let RDAY=0;const WDN=["","Mo","Di","Mi","Do","Fr"];
function setR(i,j,v){db.raster[i][j]=v;save();render()}
function setRD(i,wd,j,v){const r=db.raster[i];r[3]??={};const d=r[3][wd]??=["",""];d[j]=v===r[j+1]?"":v;if(!d[0]&&!d[1])delete r[3][wd];if(!Object.keys(r[3]).length)r.length=3;save();render()}
function clrRD(i,wd){const r=db.raster[i];if(r[3]){delete r[3][wd];if(!Object.keys(r[3]).length)r.length=3}save();render()}
const hasRD=wd=>db.raster.some(r=>r[3]?.[wd]);
function rasterV(){const wd=RDAY;
  return `<div class="card"><h2 style="margin-top:0">Stundenraster</h2><div class="sub">Damit beim Bewerten die laufende Stunde vorausgewählt ist.</div>
  <div class="pick days5" style="margin-top:10px"><button class="${wd?"":"on"}" onclick="RDAY=0;render()">Alle Tage</button>${WDN.slice(1).map((n,d)=>`<button class="${wd===d+1?"on":""}" onclick="RDAY=${d+1};render()">${n}${hasRD(d+1)?" •":""}</button>`).join("")}</div>
  <div class="sub" style="margin-top:8px">${wd?`Abweichende Zeiten am ${["","Montag","Dienstag","Mittwoch","Donnerstag","Freitag"][wd]}. Was du nicht änderst, gilt wie an allen Tagen.`:"Gilt für jeden Schultag. Weicht ein Tag ab, wähle ihn oben aus."}</div>
  <div class="rast${wd?" r4":""}"><span></span><span class="sub">Beginn</span><span class="sub">Ende</span>${wd?"<span></span>":""}${db.raster.map((r,i)=>{if(!wd)return `<b>${esc(r[0])}</b><input type="time" value="${r[1]}" onchange="setR(${i},1,this.value)"><input type="time" value="${r[2]}" onchange="setR(${i},2,this.value)">`;
    const [a,b]=rTime(r,wd),dv=r[3]?.[wd];return `<b>${esc(r[0])}</b><input type="time" class="${dv?.[0]?"dev":""}" value="${a}" onchange="setRD(${i},${wd},0,this.value)"><input type="time" class="${dv?.[1]?"dev":""}" value="${b}" onchange="setRD(${i},${wd},1,this.value)">${dv?`<button class="x" aria-label="Zurücksetzen" onclick="clrRD(${i},${wd})">✕</button>`:"<span></span>"}`}).join("")}</div>
  ${wd?"":`<p class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn ghost" onclick="addR()">+ Stunde</button>${db.raster.length>1?`<button class="btn ghost" onclick="db.raster.pop();save();render()">Letzte entfernen</button>`:""}<button class="btn ghost" onclick="db.raster=RASTER.map(r=>r.slice());save();render()">HBG-Raster</button></p>`}
  <p class="muted small">Jetzt vorausgewählt: <b>${currentSlot()||"keine Stunde"}</b> (in Pausen bleibt die Stunde davor ausgewählt)</p></div>`}
function gameV(){const g=G(),T=GOALTYPES[g.type],max=g.type==="days"?5:10;
  return `<div class="card"><h2 style="margin-top:0">Wochenziel</h2>
  <label class="swr"><span class="grow">Wochenziel und Feedback anzeigen<span class="sub">Ring auf „Heute“ und kurzer Haken nach dem Speichern</span></span><input type="checkbox" class="sw" ${g.on?"checked":""} onchange="G().on=this.checked;save();render()"></label>
  ${g.on?`<div class="sub" style="margin:14px 0 6px;font-weight:700">Was ist dein Ziel?</div>
  <div class="gopts">${Object.entries(GOALTYPES).map(([key,x])=>`<button class="${g.type===key?"on":""}" onclick="G().type='${key}';G().n=GOALTYPES['${key}'].def;save();render()"><b>${x.t}</b><span>${x.d(g.type===key?g.n:x.def)}</span></button>`).join("")}</div>
  ${g.type==="good"?"":`<div class="row stepr"><span class="grow">${g.type==="days"?"Schultage pro Woche":"Einschätzungen pro Kind und Woche"}</span><button aria-label="weniger" ${g.n<=1?"disabled":""} onclick="G().n=Math.max(1,G().n-1);save();render()">−</button><b>${g.n}</b><button aria-label="mehr" ${g.n>=max?"disabled":""} onclick="G().n=Math.min(${max},G().n+1);save();render()">+</button></div>`}
  <label class="swr"><span class="grow">Ton beim Speichern</span><input type="checkbox" class="sw" ${g.sound?"checked":""} onchange="G().sound=this.checked;save();if(this.checked)fb('big')"></label>
  <p class="muted small" style="margin-bottom:0">Nur ein Ziel pro Woche, keine Punkte, keine Abzeichen. Wochen ganz ohne Einträge (Ferien, Krankheit) unterbrechen die Reihe nicht.</p>`
  :`<p class="muted small" style="margin-bottom:0">Ausgeschaltet: Nach dem Speichern erscheint nur eine kurze Bestätigung.</p>`}</div>`}
function addR(){const l=db.raster.at(-1),n=(parseInt(l[0])||db.raster.length)+1;db.raster.push([n+".",l[2],l[2]]);save();render()}
function profilV(){
  const n=db.kids.reduce((s,k)=>s+k.goals.reduce((t,g)=>t+g.entries.length,0),0);
  return `<h1>Einstellungen</h1>
  <div class="card row"><div class="grow"><b>Anleitung</b><br><span class="small muted">In 8 Schritten erklärt, wie Pfad funktioniert.</span></div><button class="btn" onclick="openHelp()">Öffnen</button></div>
  <div class="card"><label style="margin-top:0">Dein Kürzel</label><div class="sub">Wird bei jeder Einschätzung gespeichert. Hilfreich, wenn ihr Daten im Team zusammenführt.</div>
  ${srvOn()?`<input value="${esc(db.me)}" disabled><div class="sub" style="margin-top:4px">Fest, solange du am Schulserver angemeldet bist.</div>`:`<input value="${esc(db.me)}" placeholder="z. B. MU" onchange="db.me=this.value.trim();save();render();toast('Gespeichert')">`}
  <label>Fächer</label><div class="sub">Mit Komma getrennt. Reihenfolge = Reihenfolge der Knöpfe beim Bewerten.</div>
  <input value="${esc(db.subjects.join(", "))}" onchange="db.subjects=this.value.split(',').map(s=>s.trim()).filter(Boolean);save();toast('Gespeichert')">
  <label>Klassen</label><div class="sub">Mit Komma getrennt.</div>
  <input value="${esc(db.classes.join(", "))}" onchange="db.classes=this.value.split(',').map(s=>s.trim()).filter(Boolean);save();toast('Gespeichert')"></div>
  ${rasterV()}
  ${gameV()}
  <div class="card"><h2 style="margin-top:0">Daten</h2><p class="muted">${db.kids.length} Kinder · ${n} Einschätzungen auf diesem Gerät</p>
  <p class="row" style="flex-wrap:wrap"><button class="btn pri" onclick="exportJSON()">Sicherung speichern</button><button class="btn" onclick="shareKids()">Kinder teilen</button><button class="btn" onclick="$('#imp').click()">Datei laden</button></p>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="importJSON(this)">
  <p class="muted small">${db.lastBackup?`Letzte Sicherung: ${dDEy(iso(new Date(db.lastBackup)))}. `:""}Sicherung: alle deine Kinder, nur für dich, etwa einmal pro Woche. Teilen: nur ausgewählte Kinder, für eine Kollegin oder einen Kollegen. Beim Laden wählst du pro Kind, was du ergänzt.</p>
  ${db.bsalt?`<p class="small">Sicherungs-Passwort ist auf diesem Gerät gemerkt. <button class="btn ghost small" onclick="forgetBackupPw()">Vergessen</button></p>`:""}
  <p><button class="btn" onclick="demo()">Fiktiven Beispielfall laden</button></p>
  <p><button class="btn ghost danger" onclick="wipe()">Alle Daten auf diesem Gerät löschen</button></p></div>
  ${srvCard()}
  <div class="card"><h2 style="margin-top:0">Datenschutz</h2>
  <p>Die Daten liegen in diesem Browser auf diesem Gerät. Sie verlassen es nur als verschlüsselte Datei, wenn du sicherst oder teilst${srvOn()?", oder für freigegebene Kinder an euren Schulserver":""}.</p>
  <p>Lege Kinder nur mit Kürzel an. Schreibe in Kommentare keine Namen.</p>
  <p>Sicherungen und geteilte Stände sind mit Passwort verschlüsselt. Speichere sie trotzdem nur auf dienstlichem Speicher.</p><p>Auf dem Gerät selbst liegen die Daten unverschlüsselt im Browser. Nutze deshalb nur dienstliche Geräte mit Code-Sperre.</p>
  <p>Vor dem Einsatz mit echten Fällen: Absprache mit Schulleitung und Datenschutzbeauftragten.</p></div>
  <p class="muted small" style="text-align:center">Pfad · schulinterner Prototyp</p>`;
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
/* ===== Sicherung, Teilen, Import mit Auswahl ===== */
const realKid=k=>!k.demo;
async function exportJSON(){if(!crypto.subtle)return toast("Verschlüsselung in dieser Ansicht nicht möglich. Bitte im Browser öffnen.");
  const ki=await backupKey();if(!ki)return;
  const {srv,bsalt,...rest}=db,payload={...rest,kids:db.kids.filter(realKid)};
  if(!await giveFile(`pfad-sicherung-${db.me||"ohne"}-${today()}.json`,await sealFile("sicherung",payload,ki)))return;
  db.lastBackup=Date.now();save();render();toast("Sicherung erstellt. Lege sie auf deinem Dienstgerät bzw. im Schul-OneDrive ab.")}
// Stand einzelner Kinder für Kolleg:innen
async function shareKids(pre){if(!crypto.subtle)return toast("Verschlüsselung in dieser Ansicht nicht möglich. Bitte im Browser öffnen.");
  const ks=db.kids.filter(realKid).sort((a,b)=>a.code.localeCompare(b.code));if(!ks.length)return toast("Noch keine Kinder angelegt");
  const sel=await dlg(`<p style="font-weight:700;margin:0 0 6px">Welche Kinder möchtest du teilen?</p><p class="small muted" style="margin:0 0 10px">Geteilt wird alles zu diesen Kindern: Verhalten, Einschätzungen, Tagebuch.</p>
    <div style="max-height:46vh;overflow:auto">${ks.map(k=>`<label class="row" style="margin:6px 0;font-weight:600"><input type="checkbox" style="width:auto" value="${k.id}" ${pre===k.id||(!pre&&ks.length===1)?"checked":""}> ${esc(k.code)} <span class="muted small" style="font-weight:400">${esc(k.cls||"")}</span></label>`).join("")}</div>
    <div class="duo" style="margin-top:14px"><button class="btn" data-a="0">Abbrechen</button><button class="btn pri" data-a="1">Weiter</button></div>`,
    (el,done)=>{el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="1"]').onclick=()=>done([...el.querySelectorAll("input:checked")].map(i=>i.value))});
  if(!sel||!sel.length)return;
  const pw=await askNewPw("Passwort für diesen Stand festlegen. Sag es der Kollegin oder dem Kollegen mündlich, nicht per Mail.");if(!pw)return;
  const salt=b64(rnd(16)),kids=sel.map(kidById);
  const name=`pfad-${kids.length===1?kids[0].code.replace(/[^\w\-]/g,"_"):kids.length+"-kinder"}-von-${(db.me||"ohne").replace(/[^\w\-]/g,"_")}-${today()}.json`;
  if(await giveFile(name,await sealFile("teilen",{kids,classes:[...new Set(kids.map(k=>k.cls).filter(Boolean))]},{key:await pwKey(pw,unb64(salt)),salt})))toast(`Stand von ${kids.length} Kind${kids.length===1?"":"ern"} erstellt`)}
// Import: erst ansehen und auswählen, dann ergänzen
let IMP=null;
function importJSON(inp){const f=inp.files[0];if(!f)return;inp.value="";f.text().then(async t=>{let o,d;try{o=JSON.parse(t)}catch(e){return toast("Datei nicht lesbar")}
  if(!crypto.subtle&&(o.pfad||o.salt))return toast("Verschlüsselung in dieser Ansicht nicht möglich. Bitte im Browser öffnen.");
  try{d=await openFile(o)}catch(e){return toast("Keine Pfad-Datei")}if(!d)return;if(!Array.isArray(d.kids))return toast("Keine Pfad-Datei");
  const kids=d.kids.filter(realKid);
  IMP={art:o.art||"sicherung",von:o.von||d.me||"",erstellt:o.erstellt||"",d,kids,sel:new Set(kids.filter(k=>{const x=diffKid(k);return x.neu||!x.leer}).map(k=>k.id)),settings:!db.kids.length&&(o.art||"sicherung")==="sicherung"};
  go({tab:"profil",imp:true})})}
function importV(){if(!IMP){view={tab:"profil"};return profilV()}
  const rows=IMP.kids.map(k=>{const x=diffKid(k),on=IMP.sel.has(k.id);
    const what=x.neu?`neu · ${x.goals} Verhalten · ${x.entries} Einschätzung${x.entries===1?"":"en"} · ${x.diary} Tagebuch`
      :x.leer?"nichts Neues":[x.goals&&`${x.goals} Verhalten`,x.entries&&`+${x.entries} Einschätzung${x.entries===1?"":"en"}`,x.diary&&`+${x.diary} Tagebuch`,x.changed&&`${x.changed} geändert`,x.dels&&`${x.dels} gelöscht`].filter(Boolean).join(" · ");
    return `<label class="card row" style="margin:8px 0;align-items:flex-start;${x.leer?"opacity:.6":""}"><input type="checkbox" style="width:auto;margin-top:4px" ${on?"checked":""} ${x.leer?"disabled":""} onchange="this.checked?IMP.sel.add('${k.id}'):IMP.sel.delete('${k.id}');render()">
      <span class="grow"><b>${esc(k.code)}</b> <span class="muted small">${esc(k.cls||"")}</span><br><span class="small ${x.neu?"":"muted"}" style="${x.neu?"color:var(--up);font-weight:700":""}">${x.neu?"":"vorhanden: "}${what}</span></span></label>`}).join("");
  return `<button class="btn ghost" onclick="IMP=null;go({tab:'profil'})">‹ Abbrechen</button>
  <h1>${IMP.art==="teilen"?"Geteilten Stand übernehmen":"Sicherung laden"}</h1>
  <p class="muted">${IMP.von?`Von ${esc(IMP.von)}`:""}${IMP.erstellt?` · erstellt ${dDEy(IMP.erstellt.slice(0,10))}`:""} · ${IMP.kids.length} Kind${IMP.kids.length===1?"":"er"}</p>
  <p class="small">Wähle, welche Kinder du übernimmst. Bei vorhandenen Kindern wird <b>ergänzt</b>: Neues kommt dazu, deine eigenen Einträge bleiben erhalten. Bei gleichen Einträgen gilt die neuere Fassung.</p>
  ${IMP.kids.length>1?`<p class="row"><button class="btn ghost small" onclick="IMP.kids.forEach(k=>diffKid(k).leer||IMP.sel.add(k.id));render()">Alle auswählen</button><button class="btn ghost small" onclick="IMP.sel.clear();render()">Keine</button></p>`:""}
  ${rows}
  ${IMP.art==="sicherung"?`<label class="row" style="margin:12px 0;font-weight:600"><input type="checkbox" style="width:auto" ${IMP.settings?"checked":""} onchange="IMP.settings=this.checked"> Auch Einstellungen übernehmen (Fächer, Stundenraster, Wochenziel)</label>`:""}
  <p><button class="btn pri block" ${IMP.sel.size||IMP.settings?"":"disabled"} onclick="applyImport()">${IMP.sel.size?`${IMP.sel.size} Kind${IMP.sel.size===1?"":"er"} übernehmen`:"Übernehmen"}</button></p>`}
function applyImport(){let n=0;for(const k of IMP.kids)if(IMP.sel.has(k.id)){n+=mergeKid(structuredClone(k))}
  if(IMP.settings){const d=IMP.d;for(const f of ["subjects","raster","game"])if(d[f])db[f]=d[f];if(!db.me&&d.me)db.me=d.me;(d.classes||[]).forEach(c=>db.classes.includes(c)||db.classes.push(c))}
  const m=IMP.sel.size;IMP=null;save();toast(m?`${m} Kind${m===1?"":"er"} übernommen${n<m?` (${m-n} ohne Änderung)`:""}`:"Einstellungen übernommen");go({tab:"klassen"})}
function exportCSV(kid,gid){const k=kidById(kid),g=goalById(k,gid);
  const rows=[["Kürzel","Verhalten","Datum","Stunde","Fach","Wert","Kommentar","Von"]].concat(sortE(g.entries).map(e=>[k.code,g.title,dDEy(e.date),e.slot,e.subj,e.value??"nicht beobachtet",e.note,e.rater]));
  download(`verlauf-${k.code}-${today()}.csv`,"﻿"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv")}
async function wipe(){if(!await ask("Wirklich alle Daten auf diesem Gerät löschen? Speichere vorher eine Sicherung.",{ok:"Alles löschen",danger:true}))return;db={v:2,me:db.me,subjects:db.subjects,raster:db.raster,game:db.game,srv:db.srv?{url:db.srv.url,token:""}:undefined,bsalt:db.bsalt,classes:[],kids:[]};save();go({tab:"heute"})}
function demo(){
  if(db.kids.some(k=>k.demo))return toast("Beispielfall ist schon da");
  if(!db.classes.includes("7B"))db.classes.push("7B");
  const t=today(),start=addDays(t,-14);
  const g1={id:uid(),title:"Stört den Unterricht",how:"Ruft rein, verlässt ohne Erlaubnis den Platz, lenkt andere ab.",fp:"Fiktiv: Ich melde mich, bevor ich etwas sage.",dir:"down",a0:"nie",a10:"ständig",target:3,start,entries:[]};
  const g2={id:uid(),title:"Beginnt Aufgaben selbstständig",how:"Hat nach 3 Minuten das Material da und fängt an.",fp:"Fiktiv: Ich fange Aufgaben ohne Erinnerung an.",dir:"up",a0:"gar nicht",a10:"durchgehend",target:7,start,entries:[]};
  const subj=["Mathe","Deutsch","Englisch","Mathe","GL"],slot=["1. Std.","3. Std.","5. Std.","2. Std.","4. Std."];
  const v1=[7,8,6,9,7,8,7,5,6,4,null,4,3,5,3,2,3,4],v2=[3,2,4,3,3,2,4,5,5,6,null,6,7,5,7,8,7,6];
  let d=addDays(t,-27),i=0;
  while(i<v1.length){const wd=new Date(d+"T12:00").getDay();if(wd&&wd<6){const s=subj[i%5],sl=slot[i%5],ts=new Date(d+"T10:00").getTime()+i;
    const adj=s==="Deutsch"&&v1[i]!=null?1:0;
    g1.entries.push({id:uid(),date:d,slot:sl,subj:s,value:v1[i]==null?null:Math.min(10,v1[i]+adj),note:i===7?"Neuer Sitzplatz vorne am Pult.":i===10?"Kind war bei Förderstunde.":"",rater:"MU",ts,gen:true});
    g2.entries.push({id:uid(),date:d,slot:sl,subj:s,value:v2[i]==null?null:Math.max(0,v2[i]-adj),note:i===13?"Mit Wochenplan deutlich schneller gestartet.":"",rater:"MU",ts,gen:true});i++}d=addDays(d,1)}
  const diary=[[-25,"Beobachtung","Mathe","Kommt nach der Pause oft unruhig in die Stunde. Erste 10 Minuten am schwierigsten."],[-20,"Gespräch","","Kurzes Gespräch nach der Stunde: wünscht sich einen Platz weiter vorne."],[-14,"Absprache","","Mit Klassenleitung: Sitzplatz vorne, Wochenplan mit Startsignal. Ab heute Förderung."],[-9,"Elternkontakt","","Telefonat mit der Mutter: zu Hause läuft es ähnlich, Unterstützung bei Wochenplan zugesagt."],[-4,"Erfolg","Mathe","Hat heute als Erste:r angefangen und das stolz gezeigt."],[-2,"Vorfall","Deutsch","Streit in der Gruppenarbeit, Auszeit nötig. Danach wieder gut eingestiegen."]]
    .map(([o,cat,subj,text],i)=>({id:uid(),date:addDays(t,o),cat,subj,text,rater:"MU",ts:new Date(addDays(t,o)+"T15:00").getTime()+i,gen:true}));
  db.kids.push({id:uid(),code:"DEMO-7B",icon:"🦉",cls:"7B",demo:true,goals:[g1,g2],diary});save();toast("Beispielfall geladen");go({tab:"klassen"})}

load();render();
